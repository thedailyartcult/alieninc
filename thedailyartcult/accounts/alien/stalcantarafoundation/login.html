<!DOCTYPE html>
<html lang="en" dir="ltr" prefix="og: https://ogp.me/ns#" class="js">
<head>
  <meta charset="utf-8">
  <title>Login - St. Alcantara Foundation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your St. Alcantara Foundation account to manage memberships, tickets, and preferences.">
  
  <style>
    /* Embed Elegant Austin Serif Typography */
    @font-face {
      font-family: 'Austin';
      src: url('https://www.metmuseum.org/_next/static/media/Austin_Medium_Web-s.p.d23afb03.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Austin';
      src: url('https://www.metmuseum.org/_next/static/media/Austin_MediumItalic_Web-s.p.5aa7d4a4.woff2') format('woff2');
      font-weight: 500;
      font-style: italic;
    }

    /* Direct global reset and immersive background layout */
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.92)), 
                  url('https://www.britishmuseum.org/sites/default/files/styles/uncropped_huge/public/2019-10/Great%20Court%2004.jpg?itok=V1gbVKqg') no-repeat center center fixed;
      background-size: cover;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    /* Core fonts and styles imported from the design system foundation */
    .theme-color { 
      color: #EB0000; 
    }

    header {
      padding: 40px 20px;
      text-align: center;
    }

    .brand-logo {
      font-size: 1.8rem;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      font-family: 'Austin', Georgia, 'Times New Roman', serif;
    }

    /* Main login interface wrapper */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 20px;
    }

    .login-card {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
    }

    .login-title {
      font-family: 'Austin', Georgia, 'Times New Roman', serif;
      font-size: 2.2rem;
      margin: 0 0 8px 0;
      font-weight: 500;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .login-desc {
      font-size: 0.95rem;
      color: #aaa;
      text-align: center;
      margin: 0 0 32px 0;
      line-height: 1.4;
    }

    /* Custom form elements styled to look precise and clean */
    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: #EB0000;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 1px #EB0000;
    }

    .forgot-link-container {
      text-align: right;
      margin-top: -12px;
      margin-bottom: 28px;
    }

    .forgot-link {
      color: #aaa;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      background: #EB0000;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #c20000;
    }

    /* Minimal, low-footprint footer */
    footer {
      padding: 30px 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #777;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(10, 10, 10, 0.9);
    }

    footer a {
      color: #999;
      text-decoration: none;
      margin: 0 12px;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #ffffff;
    }

    .footer-divider {
      color: #333;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <a href="templatevicious.html" class="brand-logo">St. Alcantara Foundation</a>
  </header>

  <!-- Main Login Interface -->
  <main class="login-container">
    <div class="login-card">
      <h2 class="login-title">Sign In</h2>
      <p class="login-desc">Enter your credentials to access your portal, bookings, and membership details.</p>
      
      <form action="login.html" method="POST">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>
        
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        
        <div class="forgot-link-container">
          <a href="login.html" class="forgot-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="submit-btn">Sign In</button>
      </form>
    </div>
  </main>

  <!-- Clean, low-profile footer -->
  <footer>
    <div style="margin-bottom: 12px;">
      <a href="privacy.html">Privacy Policy</a>
      <span class="footer-divider">•</span>
      <a href="login.html">Cookies</a>
      <span class="footer-divider">•</span>
      <a href="login.html">Terms of Use</a>
      <span class="footer-divider">•</span>
      <a href="login.html">Support</a>
    </div>
    <div>
      © 2026 St. Alcantara Foundation. All rights reserved.
    </div>
  </footer>

</body>
</html>
