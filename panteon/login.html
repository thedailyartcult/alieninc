<!DOCTYPE html>
<html lang="en" style="background-color:#eeeff0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTEON — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background-color: #eeeff0;
            color: #425363;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ── main card ── */
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 0 40px 4px rgba(17, 17, 24, 0.08);
            padding: 36px 28px 28px;
            transition: box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 0 48px 6px rgba(17, 17, 24, 0.12);
        }

        /* ── header / logo ── */
        .login-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            width: 100%;
        }

        .login-logo {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
            transition: filter 0.3s ease;
        }

        .login-logo svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .login-logo:hover {
            filter: drop-shadow(0 0 14px rgba(0, 255, 255, 0.35));
        }

        .login-subhead {
            font-size: 14px;
            font-weight: 400;
            color: #6c7f8f;
            margin-top: 6px;
            letter-spacing: 0.2px;
        }

        /* ── form ── */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-wrap {
            position: relative;
            border-radius: 3px;
            border: 1px solid #f1f1f1;
            background: #f1f1f1;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .input-wrap:focus-within {
            border-color: #a0a0a0;
            background: #ffffff;
        }

        .input-wrap .input-icon {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #888888;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrap .input-icon svg {
            width: 100%;
            height: 100%;
            fill: #888888;
        }

        .input-wrap input {
            font-family: 'Barlow', system-ui, sans-serif;
            font-size: 13px;
            padding: 10px 14px 10px 40px;
            width: 100%;
            border: none;
            background: transparent;
            color: rgba(0, 0, 0, 0.87);
            outline: none;
            height: 40px;
            border-radius: 3px;
        }

        .input-wrap input::placeholder {
            color: #9aabb8;
            font-weight: 400;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #888888;
            transition: color 0.2s;
            line-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #333333;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 4px;
        }

        .form-actions .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(0, 0, 0, 0.54);
            cursor: pointer;
        }

        .form-actions .remember input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #007FEC;
            cursor: pointer;
            margin: 0;
        }

        .forgot-link {
            font-size: 13px;
            font-weight: 500;
            color: #007FEC;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #00A3FF;
            text-decoration: underline;
        }

        .btn-login {
            font-family: 'Barlow', system-ui, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px 24px;
            border: none;
            border-radius: 3px;
            background: #007FEC;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: #0066C4;
            box-shadow: 0 4px 12px rgba(0, 127, 236, 0.25);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .alt-actions {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.54);
            line-height: 1.6;
        }

        .alt-actions a {
            font-weight: 500;
            color: #007FEC;
            transition: color 0.2s;
        }

        .alt-actions a:hover {
            color: #00A3FF;
            text-decoration: underline;
        }

        .legal-disclaimer {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.54);
            text-align: center;
            margin-top: 24px;
            line-height: 1.6;
            border-top: 1px solid #eef0f2;
            padding-top: 20px;
        }

        .legal-disclaimer a {
            color: #007FEC;
            font-weight: 500;
            transition: color 0.2s;
        }

        .legal-disclaimer a:hover {
            color: #00A3FF;
            text-decoration: underline;
        }

        .login-footer-note {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.40);
            text-align: center;
            margin-top: 16px;
            letter-spacing: 0.2px;
        }

        .login-footer-note strong {
            color: #2B405A;
            font-weight: 600;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 24px 18px 20px;
            }

            .login-logo {
                max-width: 200px;
            }

            .form-actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-login {
                font-size: 13px;
                padding: 13px 20px;
            }
        }

        /* ── fade-in ── */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeUp 0.4s cubic-bezier(0.3, 0, 0, 1.4) both;
        }
    </style>

        <!-- ─── LOGIN FORM ─── -->
        <form class="login-form" action="#" method="post" autocomplete="off" novalidate>
            <!-- email -->
            <div class="form-group">
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 26" xmlns="http://www.w3.org/2000/svg">
                            <g fill="none" fill-rule="evenodd"><g fill="#888888"><path d="M30 23c0 .55-.45 1-1 1H3c-.55 0-1-.45-1-1V3c0-.55.45-1 1-1h26c.55 0 1 .45 1 1v20zm0-23H2C.9 0 0 .89 0 2v22c0 1.1.9 2 2 2h28c1.1 0 2-.9 2-2V2c0-1.11-.9-2-2-2zm-8 6h4v4h-4V6zm-2 6h8V4h-8v8zM0 16h14v-2H0v2zm0 4h14v-2H0v2z"/></g></g>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email Address" required autofocus>
                </div>
            </div>

            <!-- password -->
            <div class="form-group">
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 13 16" xmlns="http://www.w3.org/2000/svg">
                            <g fill="none" fill-rule="evenodd"><g fill="#888888"><path d="M11 15.998H2c-1.104 0-2-.896-2-1.999V7.999c0-1.104.896-2 2-2v-1.5C2 2.015 4.015 0 6.5 0S11 2.015 11 4.499V5.999c1.104 0 2 .896 2 2v7.999c0 1.104-.896 1.999-2 1.999zM10 4.499C10 2.566 8.433 1 6.5 1S3 2.566 3 4.499V5.998h7V4.499zm2 3.5c0-.553-.448-1-1-1H2c-.553 0-1 .447-1 1v6c0 .552.447.999 1 .999h9c.552 0 1-.447 1-.999V7.999zm-5.5 5c-.276 0-.5-.224-.5-.5V9.498c0-.275.224-.499.5-.499s.5.224.5.499V12.5c0 .276-.224.5-.5.5z"/></g></g>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z">
                            <circle cx="12" cy="12" r="3">
                        </svg>
                    </button>
                </div>
            </div>

            <!-- actions -->
            <div class="form-actions">
                <label class="remember">
                    <input type="checkbox" name="remember" checked>
                    Remember me
                </label>
                <a href="#" class="forgot-link">Create or reset password</a>
            </div>

            <!-- submit -->
            <button type="submit" class="btn-login">
                Log In
                <svg viewBox="0 0 8 12" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="0 1.4 1.4 0 7.4 6 1.4 12 0 10.6 4.6 6" fill="currentColor">
                </svg>
            </button>

            <!-- alt actions -->
            <div class="alt-actions">
                Don't have an account? <a href="#">Request internal access</a>
            </div>
        </form>

        <!-- ─── LEGAL ─── -->
        <div class="legal-disclaimer">
            By signing in, you agree to our
            <a href="#">Terms of Use</a> and
            <a href="#">Privacy Policy</a>.
        </div>

        <div class="login-footer-note">
            <strong>PANTEON</strong> — a subsidiary of 1609 Holdings LLC · Alien.Inc Group
        </div>

    </div>

    <!-- ─── TOGGLE PASSWORD ─── -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('togglePassword');
            const passwordField = document.getElementById('password');
