<!-- Platform: tdac | Page: tdac-resonance | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-tdac-resonance'. -->
<div class="page" id="page-tdac-resonance">
                    <div class="grid grid-2">
                        <div class="card">
                            <div class="card-title" style="text-align:center">Tenant Resonance Index</div>
                            <div class="resonance-display">
                                <div class="resonance-number" id="resonanceValue">--</div>
                                <div class="resonance-label">30-day aggregate average</div>
                            </div>
                            <div class="grid grid-3" style="text-align:center;margin-top:12px">
                                <div><div class="mono" id="resMin">--</div><div class="card-sub">Min</div></div>
                                <div><div class="mono" id="resMax">--</div><div class="card-sub">Max</div></div>
                                <div><div class="mono" id="resCount">--</div><div class="card-sub">Patrons</div></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-title">Component Breakdown</div>
                            <div class="bar-chart" style="margin-top:16px" id="resonanceChart">
                                <div class="bar-row"><span class="bar-label">R1 Return Rate (25%)</span><div class="bar-track"><div class="bar-fill" id="barR1" style="width:0;background:var(--accent-cyan)"></div></div><span class="bar-value" id="valR1">--</span></div>
                                <div class="bar-row"><span class="bar-label">R2 Depth Score (25%)</span><div class="bar-track"><div class="bar-fill" id="barR2" style="width:0;background:#6366f1"></div></div><span class="bar-value" id="valR2">--</span></div>
                                <div class="bar-row"><span class="bar-label">R3 Discovery (20%)</span><div class="bar-track"><div class="bar-fill" id="barR3" style="width:0;background:var(--green)"></div></div><span class="bar-value" id="valR3">--</span></div>
                                <div class="bar-row"><span class="bar-label">R4 Ritual Score (15%)</span><div class="bar-track"><div class="bar-fill" id="barR4" style="width:0;background:var(--amber)"></div></div><span class="bar-value" id="valR4">--</span></div>
                                <div class="bar-row"><span class="bar-label">R5 Gift Score (15%)</span><div class="bar-track"><div class="bar-fill" id="barR5" style="width:0;background:var(--red)"></div></div><span class="bar-value" id="valR5">--</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="card" style="margin-top:16px">
                        <div class="card-header"><span class="card-title">Countdown to Immortality AI</span><span class="tag">Dec 31, 2026</span></div>
                        <div style="text-align:center;padding:20px 0">
                            <div style="display:flex;justify-content:center;gap:16px;margin-top:12px">
                                <div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:28px;font-weight:600;font-family:var(--font-mono);color:var(--accent-cyan)" id="cdDays">--</span><span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-top:2px">Days</span></div>
                                <div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:28px;font-weight:600;font-family:var(--font-mono);color:var(--accent-cyan)" id="cdHours">--</span><span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-top:2px">Hours</span></div>
                                <div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:28px;font-weight:600;font-family:var(--font-mono);color:var(--accent-cyan)" id="cdMins">--</span><span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-top:2px">Minutes</span></div>
                                <div style="display:flex;flex-direction:column;align-items:center"><span style="font-size:28px;font-weight:600;font-family:var(--font-mono);color:var(--accent-cyan)" id="cdSecs">--</span><span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-top:2px">Seconds</span></div>
                            </div>
                        </div>
                    </div>
                </div>
