<!-- Platform: crackerbox | Page: crackerbox-investigations | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-crackerbox-investigations'. -->
<div class="page" id="page-crackerbox-investigations">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Sanctions Screening</span>
                        </div>
                        <div style="margin-bottom:16px">
                            <input type="text" id="sanctionsQuery" placeholder="Search OFAC SDN list (min 4 characters)..." style="width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;margin-bottom:8px">
                            <div style="display:flex;gap:8px">
                                <select id="sanctionsSchema" style="width:auto;padding:8px 12px;font-size:12px">
                                    <option value="">All Types</option>
                                    <option value="Person">Person</option>
                                    <option value="Organization">Organization</option>
                                    <option value="Company">Company</option>
                                    <option value="Vessel">Vessel</option>
                                    <option value="Airplane">Airplane</option>
                                </select>
                                <button class="btn btn-primary btn-sm" onclick="searchSanctions()">Search</button>
                            </div>
                        </div>
                        <div id="sanctionsResults"><div class="empty-state">Enter a query to search the OFAC SDN sanctions list</div></div>
                    </div>
                </div>
