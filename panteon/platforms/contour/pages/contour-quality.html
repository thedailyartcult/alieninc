<!-- Platform: contour | Page: contour-quality | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-contour-quality'. -->
<div class="page" id="page-contour-quality">
                    <div class="grid grid-2" style="margin-bottom:16px">
                        <div class="card">
                            <div class="card-header"><span class="card-title">Data Quality Rules</span></div>
                            <div id="dqRulesSummary"><div class="empty-state">Run checks to see rule status</div></div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title">Run Quality Checks</span>
                                <button class="btn btn-sm btn-primary" onclick="runDQChecks()">Run All Checks</button>
                            </div>
                            <div id="dqRunResult"><div class="empty-state">Click "Run All Checks" to validate data quality</div></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Active Violations</span>
                            <button class="btn btn-sm" onclick="loadDQViolations()">Refresh</button>
                        </div>
                        <div class="table-wrap">
                            <table><thead><tr><th>Type</th><th>Object</th><th>Details</th><th>Detected</th><th>Status</th></tr></thead>
                            <tbody id="dqViolationsBody"><tr><td colspan="5"><div class="empty-state"><span class="loading"></span></div></td></tr></tbody></table>
                        </div>
                    </div>
                </div>
