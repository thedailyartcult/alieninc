[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb"
version = "1.2.5"
description = "Local-first AI memory engine for agents — Ebbinghaus decay, interaction-aware recall, bi-temporal facts, hybrid retrieval, and an MCP server. You bring the LLM."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
mcp = [
    "mcp==1.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.52.1",
]

[project.scripts]
cmb = "scripts.entry:main"
cmb-cli = "scripts.cli:main"
cmb-connect = "scripts.connect:main"
cmb-consolidate = "scripts.consolidate:main"
cmb-dashboard = "scripts.start_dashboard:main"
cmb-graph = "scripts.graph_cli:main"
cmb-graph-server = "scripts.graph_server:main"
cmb-init = "scripts.init:main"
cmb-inspector = "scripts.inspector:main"
cmb-mcp = "cmb.mcp_cli:main"
cmb-server = "scripts.start_server:main"
cmb-update = "scripts.update:main"

[tool.setuptools.packages.find]
include = ["cmb", "cmb.*", "scripts", "scripts.*"]
