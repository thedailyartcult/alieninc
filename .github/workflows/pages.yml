name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build - inject API base for laptop backend
        run: |
          echo "Frontend is static - no build needed"
          echo "API base will be https://api.alieninc.tech (via Cloudflare Tunnel to laptop :8000)"
          cat CNAME
          rm -rf _pages && mkdir -p _pages
          cp -r index.html 404.html CNAME assets _pages/ 2>/dev/null || true
          cp -r mission.html privacy.html terms.html founder.html _pages/ 2>/dev/null || true
          # Favicons + branding — required for alieninc.tech tab icon
          ls -lh ai-favicon* ai-*.png favicon.ico *.svg 2>&1 | head -n 30
          for f in ai-favicon.svg ai-favicon.png ai-favicon-16.png ai-favicon-32.png ai-favicon-180.png ai-favicon-192.png ai-favicon-512.png ai-favicon-light.png ai-favicon-light-16.png ai-favicon-light-32.png ai-favicon-light-180.png ai-favicon-light-192.png ai-favicon-light-512.png ai-16.png ai-32.png ai-180.png ai-192.png ai-512.png favicon.ico new.png logo.png; do cp -v "$f" _pages/ 2>&1 || true; done
          cp -v *.svg _pages/ 2>&1 | head -n 20 || true
          echo "--- _pages favicon verify ---"
          ls -lh _pages/*.png _pages/*.svg _pages/*.ico 2>&1 | head -n 30
          grep -o 'ai-favicon[^"?]*?v=[0-9]*' _pages/index.html | head
          # Panteon site — copy self-contained frontend (play.html, index.html, etc.) without heavy backups
          mkdir -p _pages/panteon
          rsync -a --exclude='*.bak*' --exclude='.git' --exclude='backend' --exclude='__pycache__' --exclude='*.db' --exclude='*.db-*' --exclude='data' --exclude='logs' --exclude='*.log' --exclude='*.jsonl' panteon/ _pages/panteon/ 2>/dev/null || cp -r panteon _pages/panteon 2>/dev/null || true
          # Ensure play.html is always present even if rsync filtered aggressively
          cp -f panteon/play.html _pages/panteon/play.html 2>/dev/null || true
          cp -f panteon/index.html _pages/panteon/index.html 2>/dev/null || true
          cat > _pages/config.js << 'JS'
          window.ALIENINC_CONFIG = {
            API_BASE: "https://api.alieninc.tech",
            PANTEON_API: "https://api.alieninc.tech/api/v1",
            SUPABASE_URL: "https://frwjaixxlgthkgjtafhz.supabase.co"
          };
          JS
          cat _pages/config.js
          cat _pages/CNAME; ls -lh _pages/*.html | head -n 20
          echo "--- index.html favicon lines ---"; grep -n "favicon\|apple-touch" _pages/index.html | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
