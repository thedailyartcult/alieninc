# Alien Inc — NGINX Reverse Proxy Configuration
# Deploy: sudo cp alieninc.conf /etc/nginx/sites-available/alieninc
#         sudo ln -s /etc/nginx/sites-available/alieninc /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=alieninc:10m rate=30r/m;

server {
    listen 80;
    server_name alieninc.tech www.alieninc.tech *.alieninc.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alieninc.tech www.alieninc.tech *.alieninc.tech;

    ssl_certificate     /etc/ssl/cloudflare/alieninc.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/alieninc.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # FastAPI — Panteon API + admin dashboard (port 8000)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ono-forge {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /pipeline-builder {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sims-suite gateway — simulation metrics for index.html (port 8090)
    location /api/simulations/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/companies/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/kriegspiel/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sims-suite static assets (design tokens, etc.)
    location /sims-suite/ {
        alias /home/alieninc/sims-suite/;
    }

    # Kriegspiel dashboard
    location = /kriegspiel {
        alias /home/alieninc/sims-suite/sites/kriegspiel/index.html;
    }
    location /kriegspiel/ {
        alias /home/alieninc/sims-suite/sites/kriegspiel/;
    }

    # Citadel dashboard
    location = /citadel {
        alias /home/alieninc/sims-suite/sites/citadel/index.html;
    }
    location /citadel/ {
        alias /home/alieninc/sims-suite/sites/citadel/;
    }

    # Remnants dashboard
    location = /remnants {
        alias /home/alieninc/sims-suite/sites/remnants/index.html;
    }
    location /remnants/ {
        alias /home/alieninc/sims-suite/sites/remnants/;
    }

    # Awareness dashboard
    location = /awareness {
        alias /home/alieninc/sims-suite/sites/awareness/index.html;
    }
    location /awareness/ {
        alias /home/alieninc/sims-suite/sites/awareness/;
    }

    # Platoon simulation dashboard
    location = /platoon-sim {
        alias /home/alieninc/sims-suite/sites/platoon/index.html;
    }
    location /platoon-sim/ {
        alias /home/alieninc/sims-suite/sites/platoon/;
    }

    # TDAC simulation dashboard
    location = /tdac-sim {
        alias /home/alieninc/sims-suite/sites/tdac/index.html;
    }
    location /tdac-sim/ {
        alias /home/alieninc/sims-suite/sites/tdac/;
    }

    # All sims-suite API proxies
    location /api/citadel/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/remnants/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/awareness/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/platoon/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/tdac/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compliance data — must be served before deny-internal.conf blocks /data/*
    location ^~ /data/compliance/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compliance API — must be routed to the legacy Python server
    location ^~ /api/compliance/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to legacy Python server on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    autoindex off;
    location ~ /\.git { deny all; return 404; }
    location ~ /\.env { deny all; return 404; }
    location ~ /\.backups { deny all; return 404; }
    limit_req zone=alieninc burst=10 nodelay;
    client_max_body_size 1m;
    access_log /var/log/nginx/alieninc_access.log combined;
    error_log  /var/log/nginx/alieninc_error.log warn;
}
