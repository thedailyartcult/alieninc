<!-- Platform: yono | Page: yono-functions | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-yono-functions'. -->
<div class="page" id="page-yono-functions">
                    <div class="grid grid-3" style="margin-bottom:16px">
                        <div class="card"><div class="card-title">Health Status</div><div class="card-value" id="funcHealth">--</div></div>
                        <div class="card"><div class="card-title">Exec Mode</div><div class="card-value" id="funcExecMode">--</div></div>
                        <div class="card"><div class="card-title">Model</div><div class="card-value" id="funcModel">--</div></div>
                    </div>
                    <div class="section">
                        <div class="section-header">
                            <span class="section-title">Execute Function</span>
                        </div>
                        <div class="card" style="margin-bottom:16px">
                            <form onsubmit="executeYonoFunction(event)" style="display:flex;flex-direction:column;gap:12px">
                                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                                    <div class="form-group" style="margin:0"><label class="form-label">Principal ID</label><input name="principal_id" required placeholder="e.g. analyst-42"></div>
                                    <div class="form-group" style="margin:0"><label class="form-label">Request ID</label><input name="request_id" required placeholder="e.g. req-001"></div>
                                </div>
                                <div class="form-group" style="margin:0"><label class="form-label">Task Prompt</label><textarea name="task_prompt" required placeholder="Describe the task..." rows="3"></textarea></div>
                                <div class="form-group" style="margin:0"><label class="form-label">Scoped Context (JSON, optional)</label><textarea name="scoped_context" placeholder='{"entities": [...], "region": "X"}' rows="2"></textarea></div>
                                <button type="submit" class="btn btn-primary" style="align-self:flex-start">Execute</button>
                            </form>
                        </div>
                    </div>
                    <div class="section">
                        <span class="section-title">Last Result</span>
                        <div class="card" id="funcResult" style="margin-top:8px;display:none">
                            <pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;margin:0" id="funcResultContent"></pre>
                        </div>
                    </div>
                </div>
