<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SECURE Identity Provider Authentication</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="">
<meta name="author" content="">
<meta name="theme-color" content="#022451">
<style>
  :root{
    --secure-navy:#081E36;
    --secure-navy-deep:#022451;
    --secure-blue:#1565c0;
    --secure-blue-dark:#0d47a1;
    --secure-warn:#ffc107;
    --secure-danger:#e53935;
    --secure-text:#212529;
    --secure-muted:#757575;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--secure-navy);
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    color:var(--secure-text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ── top brand band (replaces wamheader.png) ── */
  #lpftopheader{
    background:#ffffff;
    padding:20px 16px 16px;
    text-align:center;
    opacity:0;
    transition:opacity .5s ease;
  }
  .lpfbrand_img{
    display:inline-block;
    font-weight:700;
    letter-spacing:.42em;
    text-indent:.42em;
    font-size:1.55rem;
    line-height:1.1;
    color:var(--secure-navy-deep);
  }
  .lpfbrand_img small{
    display:block;
    margin-top:5px;
    font-size:.6rem;
    font-weight:600;
    letter-spacing:.3em;
    text-indent:.3em;
    color:#4a5a72;
  }
  #lpf_header{padding:0;}

  /* ── navbar (hidden, as in original) ── */
  #lpftopnavbar{
    display:none;
    background-color:var(--secure-navy-deep);
    background-image:linear-gradient(to right,#025B85,#022451);
    color:#fff;
    padding:10px 18px;
  }
  #lpftopnavbar .brand{color:#fff;font-weight:500;font-size:1.05rem;}

  /* ── page ── */
  #lpfpage{
    background-color:#ffffff;
    flex:1 0 auto;
    padding:24px 16px 72px;
  }

  /* ── home button + countdown progress ── */
  #lpf_change_lang_no_header{max-width:980px;margin:0 auto;min-height:60px;}
  #lpf_back_home{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px;height:40px;
    border-radius:50%;
    background:#f8f9fa;
    border:1px solid rgba(0,0,0,.06);
    box-shadow:0 1px 3px rgba(0,0,0,.14);
    transition:box-shadow .2s ease;
  }
  #lpf_back_home:hover{box-shadow:0 2px 6px rgba(0,0,0,.22);}
  #lpf_back_home svg{width:20px;height:20px;fill:#212529;}
  .progress{
    height:2px;
    margin-top:4px;
    background:#e9ecef;
    border-radius:1px;
    overflow:hidden;
  }
  #lpf_home_progress{
    height:100%;
    width:96.6667%;
    background-color:var(--secure-blue);
    background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%,transparent);
    background-size:1rem 1rem;
    animation:secure-stripes 1s linear infinite;
    transition:width 10s linear;
  }
  @keyframes secure-stripes{from{background-position:1rem 0;}to{background-position:0 0;}}

  /* ── login card ── */
  .lpf_main_container{display:flex;justify-content:center;align-items:flex-start;}
  .lpf_card_class_login{width:100%;max-width:460px;}
  .lpf_card_body{
    background:#fff;
    border-radius:2px;
    box-shadow:0 2px 6px rgba(8,30,54,.16),0 1px 2px rgba(8,30,54,.24);
    padding:34px 42px 26px;
    opacity:0;
    transition:opacity .5s ease;
  }
  .lpf_auth_title{display:none;text-align:center;margin:0 0 18px;}

  /* ── floating-label material fields ── */
  .bmd-form-group{position:relative;margin:26px 0 30px;}
  .bmd-label-floating{
    position:absolute;
    left:34px;
    top:8px;
    margin:0;
    color:var(--secure-muted);
    font-size:.95rem;
    pointer-events:none;
    transition:all .18s ease;
  }
  .bmd-form-group.is-focused .bmd-label-floating,
  .bmd-form-group.is-filled .bmd-label-floating{
    top:-14px;
    font-size:.75rem;
    color:var(--secure-blue);
  }
  .input-group{display:flex;align-items:center;}
  .input-group-addon{flex:0 0 auto;width:26px;color:var(--secure-muted);display:inline-flex;}
  .input-group-addon svg{width:18px;height:18px;fill:currentColor;}
  .form-control{
    flex:1 1 auto;
    width:100%;
    border:0;
    border-bottom:1px solid #cfd4da;
    padding:8px 4px 7px;
    font-size:1rem;
    font-family:inherit;
    background:transparent;
    color:var(--secure-text);
  }
  .form-control:focus{outline:0;border-bottom:2px solid var(--secure-blue);padding-bottom:6px;}
  .lpf_eye{
    flex:0 0 auto;
    padding:4px;
    cursor:pointer;
    color:var(--secure-muted);
    display:inline-flex;
    align-items:center;
  }
  .lpf_eye:hover{color:var(--secure-text);}
  .lpf_eye svg{width:20px;height:20px;fill:currentColor;}

  /* ── buttons ── */
  .lpf_input_submit_div{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .btn{
    display:inline-block;
    border:0;
    border-radius:2px;
    padding:9px 22px;
    font-size:.9rem;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
    transition:box-shadow .2s ease,background-color .2s ease;
  }
  .btn-warning{background:var(--secure-warn);color:#212529;}
  .btn-warning:hover{background:#e0a800;}
  .btn-info{background:#17a2b8;color:#fff;}
  .btn-primary{
    position:relative;
    background:var(--secure-blue);
    color:#fff;
    box-shadow:0 2px 4px rgba(21,101,192,.45);
  }
  .btn-primary:hover{background:var(--secure-blue-dark);}
  .btn-primary[disabled]{opacity:.7;cursor:default;}
  .btn-primary.is-loading{color:transparent;}
  .btn-primary.is-loading::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:16px;height:16px;
    margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:secure-spin .7s linear infinite;
  }
  @keyframes secure-spin{to{transform:rotate(360deg);}}
  .btn-link{
    background:none;
    border:0;
    color:var(--secure-blue);
    padding:6px 4px;
    font-size:.85rem;
    text-decoration:none;
    cursor:pointer;
  }
  .btn-link a{color:inherit;text-decoration:none;}
  .btn-link:hover{text-decoration:underline;}
  .btn-sm{font-size:.82rem;}
  .lpf_separator{border-top:1px solid #e9ecef;margin:22px 0 12px;}
  .lpf_links_row{text-align:center;}

  /* ── error callout (injected by server on auth failure) ── */
  .lpf_call_out_error{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:#fdecea;
    border-left:4px solid var(--secure-danger);
    border-radius:2px;
    padding:12px 14px;
    margin:0 0 18px;
    font-size:.88rem;
    line-height:1.45;
    color:#5f2120;
  }
  .lpf_call_out_error .t{display:block;font-weight:600;margin-bottom:2px;}

  /* ── toast notification (lpf_alert) ── */
  #secure_notify{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:9999;
    min-width:260px;
    max-width:360px;
    background:var(--secure-danger);
    color:#fff;
    border-radius:3px;
    box-shadow:0 4px 14px rgba(0,0,0,.28);
    padding:13px 16px;
    font-size:.88rem;
    line-height:1.4;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .25s ease,transform .25s ease;
    pointer-events:none;
  }
  #secure_notify.show{opacity:1;transform:translateY(0);pointer-events:auto;}

  /* ── footer ── */
  #footer{
    display:none;
    padding:26px 16px 34px;
    text-align:center;
    color:rgba(255,255,255,.82);
    font-size:.85rem;
  }
  #footer .product_name{display:block;margin:0 0 14px;}
  #footer .brand{
    display:inline-block;
    background:#fff;
    color:var(--secure-navy-deep);
    padding:8px 22px;
    border-radius:2px;
    font-weight:700;
    letter-spacing:.34em;
    text-indent:.34em;
    font-size:.8rem;
  }

  .lpf_hidden{display:none!important;}

  @media (max-width:540px){
    .lpf_card_body{padding:26px 22px 20px;}
    .lpfbrand_img{font-size:1.2rem;}
  }
</style>
</head>
<body>

<div id="lpftopheader">
  <span class="lpfbrand_img">SECURE<small>Identity Provider Authentication</small></span>
</div>
<div id="lpf_header" class="lpf_additional_header"></div>

<nav id="lpftopnavbar" class="navbar topnavbarheader navbar-inner">
  <form id="lpflang_n" class="lpflang" action="/pxpadmin/uaseua/languages.htm" method="post" name="wamlang" style="display:none;">
    <select name="lang" id="chooselang_n">
      <option value="en" selected="selected">English</option>
      <option value="fr">Français</option>
      <option value="ja">日本語</option>
      <option value="de">Deutsch</option>
      <option value="ro">Românesc</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>
  </form>
  <div class="brand lpfproduct_name">SECURE Identity Provider Authentication</div>
</nav>

<div id="lpfprogress" style="display:none;"><div class="lpf_mat_progress"><div class="indeterminate" style="width:100%"></div></div></div>
<div id="lpfredirection" style="display:none;" class="badge badge-info">Redirection in progress ...</div>

<div id="lpfpage">

  <div id="lpf_change_lang_no_header">
    <div id="lpf_circle_progressbar_container">
      <span id="lpf_back_home" title="Back to Portal">
        <a href="https://secure.interpol.int/" aria-label="Back to Portal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
      </span>
      <div class="progress">
        <div id="lpf_home_progress" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>
    <form class="lpflang" action="/pxpadmin/uaseua/languages.htm" method="post" name="wamlang_no_header" style="display:none;">
      <select name="lang" id="chooselang">
        <option value="en" selected="selected">English</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="de">Deutsch</option>
        <option value="ro">Românesc</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
      </select>
    </form>
  </div>

  <div class="modal fade" id="lpf_modal_builtin_action" tabindex="-1" role="dialog" aria-hidden="true" style="display:none;">
    <div class="modal-dialog modal-lg" id="lpf_modal_builtin_doc" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="lpf_modal_builtin_action_title">SECURE Identity Provider Authentication</h5>
        </div>
        <div class="modal-body"><div id="lpf_modal_action"></div></div>
      </div>
    </div>
  </div>

  <div class="lpf_main_container" role="main" id="lpfaction_columns_small">
    <div class="lpf_card_class_login">
      <div class="lpf_card_body">

        <div class="lpf_auth_title">
          <span>You requested a service which needs authentication</span>
        </div>

        <!--SECURE_ERROR-->

        <form class="form-horizontal" id="main_auth_form" action="/pxpadmin/bin/authform.cgi" method="post" name="authform" onsubmit="return CheckForm(this);">

          <input type="hidden" name="testActionForm" value="NONE">
          <input type="hidden" name="authtype" value="0">

          <div class="form-group bmd-form-group">
            <label class="bmd-label-floating lpf_float_label" for="user">Enter your login.</label>
            <div class="input-group controls">
              <span class="input-group-addon" title="User">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
              </span>
              <input class="form-control" type="text" id="user" name="user" tabindex="1" autocomplete="username">
            </div>
          </div>

          <div class="form-group bmd-form-group">
            <label class="bmd-label-floating lpf_float_label" for="password">Enter your password.</label>
            <div class="input-group controls" id="show_hide_password">
              <span class="input-group-addon" title="Password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg>
              </span>
              <input class="form-control" type="password" id="password" name="password" tabindex="2" autocomplete="current-password">
              <a href="#" class="lpf_eye" id="lpf_eye" aria-label="Show password"></a>
            </div>
          </div>

          <div class="control-group" style="text-align:center;">
            <div class="controls">
              <div class="controls" id="lpf_user_remember_row" style="text-align:center">
                <div class="checkbox" style="display:none;" id="lblrememberMe">
                  <label for="rememberMe">
                    <input type="checkbox" id="rememberMe" name="rememberMe" tabindex="-1">
                    &nbsp;Remember Me
                  </label>
                </div>
              </div>

              <input type="hidden" name="lpfFragmentUrl">

              <div class="lpf_input_submit_div">
                <input id="lpf_cancel" class="btn btn-warning lpf_btn" type="button" name="cancel" value="Cancel" tabindex="21" onclick="window.location='https://secure.interpol.int/';">
                <span id="lpf_help" class="btn btn-info lpf_btn" style="display:none;">Help</span>
                <button id="ok" class="btn btn-primary btn-raised lpf_submit_btn lpf_input_submit_btn" type="submit" name="ok" value="Ok" tabindex="20">Ok</button>
              </div>

              <div class="controls" style="margin-top:10px;">
                <div class="controls">
                  <div class="lpf_separator"></div>
                  <div class="lpf_links_row">
                    <span id="lpf_pwdreset" class="btn btn-link btn-sm lpf_btn">
                      <a href="https://secure-welcome.interpol.int/itrust-self-service/forgot-password">Forgotten password?</a>
                    </span>
                    <span id="lpf_selfreg" class="btn btn-link btn-sm lpf_btn" style="display:none;">
                      <a href="https://secure-idpu.interpol.int/registration/self_reg.htm">Create an account</a>
                    </span>
                    <span id="lpf_lostid" class="btn btn-link btn-sm lpf_btn" style="display:none;">
                      <a href="https://secure-idpu.interpol.int/lostuid/lost_user_id.htm">Lost identifier</a>
                    </span>
                    <span id="lpf_addlink" class="btn btn-link btn-sm lpf_btn" style="display:none;"></span>
                  </div>
                </div>
                <div class="alert alert-info" style="display:none;" id="help_div"></div>
              </div>
            </div>
          </div>

          <input type="hidden" name="uri" value="/form/">
          <input type="hidden" name="ident" value="-1">
          <input type="hidden" name="msgstate" value="off">

        </form>

      </div>
    </div>
  </div>

</div>

<div id="footer" class="lpf_footer">
  <span class="product_name">© SECURE 2024. All rights reserved.</span>
  <span class="brand">SECURE</span>
</div>

<div id="secure_notify" role="alert"></div>

<script>
'use strict';

var SECURE_BACK_URL = 'https://secure.interpol.int/';
var SECURE_TIMEOUT = 300000;   /* 5 min, as original */
var SECURE_INTERVAL = 10000;

/* ── lpf_alert: bottom-right danger toast (bootstrap-notify style) ── */
var _secureToastTimer = null;
function lpf_alert(msg){
  var toast = document.getElementById('secure_notify');
  if (!toast) { alert(msg); return; }
  toast.textContent = msg;
  toast.classList.add('show');
  if (_secureToastTimer) clearTimeout(_secureToastTimer);
  _secureToastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 4000);
}

/* ── original helpers ── */
function caps(element){
  element.value = element.value.toUpperCase();
}

function GetFragmentUrl(authform){
  var hash = decodeURIComponent(self.document.location.hash);
  if (hash && hash.indexOf('#') === -1) {
    hash = '#' + hash;
  }
  authform.lpfFragmentUrl.value = hash;
  return true;
}

function CheckForm(authform){
  GetFragmentUrl(authform);
  authform.user.value = authform.user.value.replace(/(^\s*)|(\s*$)/g, '');

  if (authform.user.value.length == 0) {
    lpf_alert('Enter an identifier.');
    authform.user.focus();
    return false;
  }
  if (authform.password.value.length == 0) {
    lpf_alert('Enter your current password.');
    authform.password.focus();
    return false;
  }
  var ok = document.getElementById('ok');
  if (ok) {
    ok.classList.add('is-loading');
    ok.setAttribute('disabled', 'disabled');
  }
  return true;
}

window.addEventListener('unload', function(){
  var ok = document.getElementById('ok');
  if (ok) ok.removeAttribute('disabled');
});

(function(){
  var EYE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
  var EYE_SLASH = '<svg viewBox="0 0 640 512" aria-hidden="true"><path d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zM320 128c-17.67 0-32 14.33-32 32 0 3.29.5 6.47 1.4 9.45l45.52 71.85c-.46 1.45-.72 2.97-.72 4.55 0 17.67 14.33 32 32 32 12.3 0 22.84-6.95 28.19-17.11l45.54 71.89C476.36 365.5 507.7 384 544 384c3.59 0 7.16-.19 10.69-.55l-51.35-40.63C488.06 326.06 480 304.86 480 288c0-17.67 14.33-32 32-32s32 14.33 32 32c0 2.38-.26 4.7-.76 6.94l46.5 36.82c3.59-11.54 5.55-23.73 5.55-36.26-.01-70.59-57.26-128-127.29-167.5z"/></svg>';

  function ready(fn){
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  ready(function(){
    /* fade-in card + header (original: lpf_show_fadin_logincard) */
    var card = document.querySelector('.lpf_card_body');
    if (card) card.style.opacity = '1';
    var header = document.getElementById('lpftopheader');
    if (header) header.style.opacity = '1';

    /* reveal footer only when top-level window (original behaviour) */
    try {
      if (window.location.href == top.location.href) {
        var footer = document.getElementById('footer');
        if (footer) footer.style.display = 'block';
      }
    } catch(e) {}

    /* floating labels (bmd is-filled / is-focused) */
    var controls = document.querySelectorAll('#main_auth_form .form-control');
    Array.prototype.forEach.call(controls, function(el){
      var group = el.closest('.bmd-form-group');
      var refresh = function(){
        if (!group) return;
        if (el.value.length > 0) group.classList.add('is-filled');
        else group.classList.remove('is-filled');
      };
      refresh();
      el.addEventListener('focus', function(){ if (group) group.classList.add('is-focused'); });
      el.addEventListener('blur', function(){ if (group) group.classList.remove('is-focused'); refresh(); });
      el.addEventListener('input', refresh);
    });

    /* show / hide password */
    var eye = document.getElementById('lpf_eye');
    var pwd = document.getElementById('password');
    if (eye && pwd) {
      eye.innerHTML = EYE_SLASH;
      eye.addEventListener('click', function(ev){
        ev.preventDefault();
        var show = (pwd.type === 'password');
        pwd.type = show ? 'text' : 'password';
        eye.innerHTML = show ? EYE : EYE_SLASH;
        eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        pwd.focus();
      });
    }

    /* countdown progress + auto redirect (original: lpf_handle_back_auth_auto_timeout) */
    var progress = document.getElementById('lpf_home_progress');
    var countdown = SECURE_TIMEOUT;
    var iv = setInterval(function(){
      countdown -= SECURE_INTERVAL;
      var pct = Math.max(countdown, 0) * 100 / SECURE_TIMEOUT;
      if (progress) progress.style.width = pct + '%';
      if (countdown <= 0) clearInterval(iv);
    }, SECURE_INTERVAL);
    setTimeout(function(){ window.location = SECURE_BACK_URL; }, SECURE_TIMEOUT);

    /* focus first field */
    var user = document.getElementById('user');
    if (user) user.focus();
  });
})();
</script>

</body>
</html>
