<!-- Platform: yono | Page: yono-chat | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-yono-chat'. -->
<div class="page" id="page-yono-chat">
                    <div class="section">
                        <div class="section-header">
                            <span class="section-title">Quick Query</span>
                            <select id="chatAgentSelect" style="width:240px" onchange="resetChat()"></select>
                        </div>
                        <div class="card" style="margin-top:8px;display:flex;flex-direction:column;height:500px">
                            <div id="chatMessages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
                                <div class="empty-state">Select a department and start typing</div>
                            </div>
                            <form onsubmit="sendChatMessage(event)" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--border-light)">
                                <input id="chatInput" name="message" required placeholder="Type a message..." style="flex:1">
                                <button type="submit" class="btn btn-primary">Send</button>
                            </form>
                        </div>
                    </div>
                </div>
