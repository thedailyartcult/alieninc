<!-- Platform: contour | Page: contour-search | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-contour-search'. -->
<div class="page" id="page-contour-search">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Full-Text Search</span>
                            <button class="btn btn-sm" onclick="rebuildSearchIndex()">Rebuild Index</button>
                        </div>
                        <div style="display:flex;gap:8px;margin-bottom:16px">
                            <input type="text" id="searchInput" placeholder="Search across all ontology objects..." style="flex:1;padding:8px 12px;font-size:12px" onkeydown="if(event.key==='Enter')doSearch()">
                            <button class="btn btn-primary" onclick="doSearch()">Search</button>
                        </div>
                        <div id="searchResults"><div class="empty-state">Enter a search term to find objects</div></div>
                    </div>
                </div>
