<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTEON — Scan Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#0a0f1a;--panel:#111827;--border:rgba(0,255,255,0.08);--cyan:#00FFFF;--orange:#F87B1E;--red:#ff1744;--yellow:#ffab00;--green:#00e676;--blue:#448aff;--text:#c8d6e5;--muted:rgba(255,255,255,0.4)}
        body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

        .app{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:52px 1fr;height:100vh}

        .header{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:10}
        .header__brand{display:flex;align-items:center;gap:12px}
        .header__logo-link{display:block;height:32px;width:auto}
        .header__logo-svg{height:100%;width:auto;display:block}
        .header__logo-link:hover .header__logo-svg{filter:drop-shadow(0 0 8px rgba(0,255,255,0.4))}
        .header__sep{color:var(--muted);font-weight:300}
        .header__user{font-size:12px;color:var(--muted)}
        .header__actions{display:flex;gap:8px}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:600;font-family:'Barlow',sans-serif;cursor:pointer;border:none;transition:all 0.2s}
        .btn-cyan{background:var(--cyan);color:#0a0f1a}
        .btn-cyan:hover{background:#00E5E5}
        .btn-cyan:disabled{opacity:0.4;cursor:not-allowed}
        .btn-red{background:rgba(255,23,68,0.15);color:var(--red);border:1px solid rgba(255,23,68,0.3)}
        .btn-red:hover{background:rgba(255,23,68,0.25)}
        .btn-ghost{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.1)}
        .btn-ghost:hover{background:rgba(255,255,255,0.1)}

        .sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .sidebar__title{padding:14px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);border-bottom:1px solid var(--border)}
        .sidebar__list{flex:1;overflow-y:auto;padding:8px}
        .target-item{padding:10px 12px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background 0.15s;border:1px solid transparent}
        .target-item:hover{background:rgba(0,255,255,0.05);border-color:var(--border)}
        .target-item.active{background:rgba(0,255,255,0.08);border-color:rgba(0,255,255,0.15)}
        .target-item__dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
        .target-item__name{color:#fff;font-weight:500;font-size:13px}
        .target-item__host{color:var(--muted);font-size:10px;font-family:'JetBrains Mono',monospace}
        .sidebar__section{padding:12px;border-top:1px solid var(--border)}
        .sidebar__label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
        .plugin-check{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;color:var(--text);cursor:pointer}
        .plugin-check input{accent-color:var(--cyan);width:13px;height:13px}

        .main{display:flex;flex-direction:column;overflow:hidden}
        .progress-bar{height:3px;background:rgba(255,255,255,0.04);position:relative}
        .progress-bar__fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width 0.4s ease;width:0%}
        .progress-info{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2)}
        .progress-info__status{display:flex;align-items:center;gap:8px}
        .progress-info__dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
        .progress-info__dot.scanning{background:var(--green);animation:pulse 1.5s infinite}
        .progress-info__dot.done{background:var(--cyan)}
        .progress-info__dot.error{background:var(--red)}
        .progress-info__pct{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-weight:600}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

        .terminal{flex:1;overflow-y:auto;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;background:#060a12}
        .t{display:flex;gap:10px}
        .t ts{color:rgba(255,255,255,0.12);min-width:65px;flex-shrink:0}
        .t msg{word-break:break-all}
        .t.info msg{color:var(--text)}
        .t.warn msg{color:var(--yellow)}
        .t.ok msg{color:var(--green)}
        .t.err msg{color:var(--red)}
        .t.plug msg{color:var(--cyan)}
        .t.find msg{color:var(--orange)}
        .t.find.scritical msg{color:var(--red);font-weight:700}
        .t.find.shigh msg{color:var(--orange)}
        .t.find.smedium msg{color:var(--yellow)}
        .t.find.slow msg{color:var(--green)}

        .right-panel{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .right-panel__title{padding:14px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);border-bottom:1px solid var(--border)}
        .results-scroll{flex:1;overflow-y:auto;padding:12px}

        .score-card{text-align:center;padding:16px;margin-bottom:14px;background:rgba(0,0,0,0.2);border-radius:8px;border:1px solid var(--border)}
        .score-card__number{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;color:#fff}
        .score-card__label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
        .score-card__grade{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;margin-top:2px}

        .sev-row{display:flex;gap:4px;margin-bottom:14px}
        .sev-pill{flex:1;text-align:center;padding:6px 2px;border-radius:4px;background:rgba(255,255,255,0.03);border:1px solid var(--border)}
        .sev-pill__c{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#fff}
        .sev-pill__l{font-size:8px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:1px}
        .sev-pill.sc .sev-pill__c{color:var(--red)}
        .sev-pill.sh .sev-pill__c{color:var(--orange)}
        .sev-pill.sm .sev-pill__c{color:var(--yellow)}
        .sev-pill.sl .sev-pill__c{color:var(--green)}
        .sev-pill.si .sev-pill__c{color:var(--blue)}

        .fcard{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:5px;border-left:3px solid var(--muted)}
        .fcard.fc{border-left-color:var(--red)} .fcard.fh{border-left-color:var(--orange)}
        .fcard.fm{border-left-color:var(--yellow)} .fcard.fl{border-left-color:var(--green)}
        .fcard__n{font-size:12px;font-weight:600;color:#fff}
        .fcard__cvss{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;margin-left:4px}
        .fcard__m{font-size:10px;color:var(--muted);margin-top:2px}

        .hitem{padding:8px 10px;border-radius:4px;border:1px solid var(--border);margin-bottom:4px;cursor:pointer;transition:border-color 0.2s}
        .hitem:hover{border-color:rgba(0,255,255,0.3)}
        .hitem__top{display:flex;justify-content:space-between;align-items:center}
        .hitem__id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--cyan)}
        .hitem__st{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;text-transform:uppercase}
        .hitem__st.done{background:rgba(0,230,118,0.15);color:var(--green)}
        .hitem__st.running{background:rgba(0,255,255,0.15);color:var(--cyan)}
        .hitem__t{font-size:10px;color:var(--muted);margin-top:2px}

        .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}

        ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

        @media(max-width:1100px){.app{grid-template-columns:1fr;grid-template-rows:52px 1fr}.sidebar,.right-panel{display:none}}
    </style>

        {id:1014, name:'Error Page Info Disclosure', family:'Web', cvss:5.0, desc:'Checks error pages for server/stack leaks'},
        {id:1017, name:'Timing Side-Channel Detection', family:'Web', cvss:4.3, desc:'Measures bot vs human response latency'},
        {id:1018, name:'Cache Poisoning via Bot UA', family:'Web', cvss:6.1, desc:'Tests if bot responses are cacheable'},
        {id:1020, name:'HTTP Method Override Bypass', family:'Web', cvss:6.5, desc:'Tests X-HTTP-Method-Override UA bypass'},
        {id:1021, name:'JS Bot Detection Source Leak', family:'Web', cvss:5.3, desc:'Scans JS for hardcoded bot detection logic'},
        {id:1022, name:'CORS Preflight Bot Bypass', family:'Web', cvss:5.0, desc:'Tests OPTIONS CORS headers for bot/human differences'},
        {id:1023, name:'API Endpoint Bot Bypass', family:'Web', cvss:7.5, desc:'Tests if /api/* returns real data to bot UAs'},
        {id:1024, name:'AI Crawler Perspective', family:'Web', cvss:0.0, desc:'Alien Inc in a Nutshell — what an AI/LLM sees on alieninc.tech'}
    ];

    // ─── Render sidebar ───
    var selectedTargets = ALL_TARGETS.map(function(t){return t.id});
    (function(){
        var html = '';
        ALL_TARGETS.forEach(function(t){
            html += '<div class="target-item active" data-id="'+t.id+'" onclick="toggleTarget(this)">';
            html += '<div class="target-item__dot"></div>';
            html += '<div><div class="target-item__name">'+esc(t.name)+'</div>';
            html += '<div class="target-item__host">'+esc(t.host)+':'+t.ports[0]+'</div></div></div>';
        });
        document.getElementById('targetList').innerHTML = html;

        var ph = '';
        PLUGINS.forEach(function(p){
            ph += '<label class="plugin-check"><input type="checkbox" value="'+p.id+'" checked> '+esc(p.name)+' ('+p.cvss+')</label>';
        });
        document.getElementById('pluginList').innerHTML = ph;
    })();

    loadHistory();

    // ─── State ───
    var findings = [];
    var scanning = false;
    var cancelled = false;

    // ─── Terminal ───
    function log(cls, msg){
        var term = document.getElementById('terminal');
        var ts = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
        var d = document.createElement('div');
        d.className = 't '+cls;
        d.innerHTML = '<ts>['+ts+']</ts><msg>'+esc(msg)+'</msg>';
        term.appendChild(d);
        term.scrollTop = term.scrollHeight;
    }

    function setStatus(cls, text){
        document.getElementById('statusDot').className = 'progress-info__dot '+cls;
        document.getElementById('statusText').textContent = text;
    }

    function setProgress(pct){
        document.getElementById('progressFill').style.width = pct+'%';
        document.getElementById('progressPct').textContent = pct.toFixed(1)+'%';
    }

    // ─── Findings ───
    function addFinding(f){
        findings.push(f);
        updateSevCounts();
        var list = document.getElementById('findingList');
        var c = document.createElement('div');
        c.className = 'fcard f'+f.severity.charAt(0);
        c.innerHTML = '<div class="fcard__n">'+esc(f.name)+'<span class="fcard__cvss" style="color:'+cvssColor(f.cvss)+'">'+f.cvss+'</span></div>'
            +'<div class="fcard__m">'+esc(f.target)+':'+(f.port||'*')+' — '+esc(f.desc||'')+'</div>';
        list.prepend(c);
    }

    function updateSevCounts(){
        var c={critical:0,high:0,medium:0,low:0,info:0};
        findings.forEach(function(f){c[f.severity]=(c[f.severity]||0)+1;});
        document.getElementById('sevC').textContent=c.critical;
        document.getElementById('sevH').textContent=c.high;
        document.getElementById('sevM').textContent=c.medium;
        document.getElementById('sevL').textContent=c.low;
        document.getElementById('sevI').textContent=c.info;
    }

    function updateScore(){
        var s=100;
        s-=(findings.filter(function(f){return f.severity==='critical'}).length)*15;
        s-=(findings.filter(function(f){return f.severity==='high'}).length)*8;
        s-=(findings.filter(function(f){return f.severity==='medium'}).length)*3;
        s-=(findings.filter(function(f){return f.severity==='low'}).length)*1;
        s=Math.max(0,s);
        document.getElementById('scoreNumber').textContent=s;
        var g=s>=90?'A':s>=80?'B':s>=70?'C':s>=60?'D':'F';
        var el=document.getElementById('scoreGrade');
        el.textContent='Grade: '+g;
        el.style.color={A:'#00e676',B:'#76ff03',C:'#ffab00',D:'#ff6d00',F:'#ff1744'}[g];
    }

    function cvssColor(c){if(c>=9)return'#ff1744';if(c>=7)return'#ff6d00';if(c>=4)return'#ffab00';if(c>0)return'#00e676';return'#448aff';}

    // ─── Scan Engine (client-side) ───
    function startScan(){
        if(scanning)return;
        var targets = ALL_TARGETS.filter(function(t){return selectedTargets.indexOf(t.id)!==-1;});
        if(!targets.length){alert('Select at least one target');return;}
        var pluginIds = [];
        document.querySelectorAll('#pluginList input:checked').forEach(function(cb){pluginIds.push(parseInt(cb.value));});
        if(!pluginIds.length){alert('Select at least one plugin');return;}

        findings = [];
        document.getElementById('findingList').innerHTML = '';
        document.getElementById('scoreNumber').textContent = '—';
        document.getElementById('scoreGrade').textContent = '';
        updateSevCounts();

        scanning = true;
        cancelled = false;
        document.getElementById('scanBtn').disabled = true;
        document.getElementById('scanBtn').textContent = 'Scanning...';
        document.getElementById('cancelBtn').style.display = 'inline-flex';

        var scanId = 'HS-' + Date.now().toString(36).toUpperCase();
        log('info', '[scan] Scan '+scanId+' started: '+pluginIds.length+' plugins, '+targets.length+' targets');
        setStatus('scanning', 'Initializing...');

        // Run simulated scan (client-side checks)
        runClientScan(scanId, targets, pluginIds);
    }

    async function runClientScan(scanId, targets, pluginIds){
        var totalTasks = pluginIds.length * targets.reduce(function(a,t){return a+t.ports.length;},0);
        var done = 0;

        for(var pi=0; pi<pluginIds.length; pi++){
            if(cancelled) break;
            var plugin = PLUGINS.find(function(p){return p.id===pluginIds[pi];});
            if(!plugin) continue;

            log('plug', '[plugin] \u25b8 '+plugin.name+' (ID:'+plugin.id+', family='+plugin.family+', CVSS='+plugin.cvss+')');

            for(var ti=0; ti<targets.length; ti++){
                if(cancelled) break;
                var target = targets[ti];

                for(var porti=0; porti<target.ports.length; porti++){
                    if(cancelled) break;
                    var port = target.ports[porti];

                    log('info', '    \u2514\u2500 Checking '+target.name+':'+port+' with '+plugin.name);
                    setStatus('scanning', plugin.name+' on '+target.name+':'+port);

                    // Simulate async check
                    await sleep(150 + Math.random()*300);

                    // Client-side vulnerability detection
                    var result = await clientCheck(plugin, target, port);
                    if(result){
                        result.target = target.name;
                        result.host = target.host;
                        addFinding(result);
                        var sc = 's'+result.severity.charAt(0);
                        log('find '+sc, '[FINDING] \u25cf '+result.severity.toUpperCase()+' | '+plugin.name+' | '+target.name+':'+port+' | CVSS '+result.cvss);
                        if(result.desc) log('find '+sc, '  \u2193 '+result.desc);
                        if(result.evidence) log('info', '  \u2193 Evidence: '+result.evidence);
                    }

                    done++;
                    setProgress((done/totalTasks)*100);
                }
            }
            log('info', '    \u2713 '+plugin.name+' completed');
        }

        // Done
        scanning = false;
        var elapsed = (Date.now() - parseInt(scanId.split('-')[1],36)) / 1000;
        log('ok', '[scan] Scan completed in '+elapsed.toFixed(1)+'s \u2014 '+findings.length+' findings');

        var sevs={critical:0,high:0,medium:0,low:0,info:0};
        findings.forEach(function(f){sevs[f.severity]=(sevs[f.severity]||0)+1;});
        log('ok', '  \u2193 Critical: '+sevs.critical+' | High: '+sevs.high+' | Medium: '+sevs.medium+' | Low: '+sevs.low);

        setStatus('done', 'Completed');
        setProgress(100);
        updateScore();

        document.getElementById('scanBtn').disabled = false;
        document.getElementById('scanBtn').textContent = 'Start Scan';
        document.getElementById('cancelBtn').style.display = 'none';

        // Save to history
        saveHistory(scanId, targets, findings, elapsed);
        loadHistory();
    }

    // ─── Client-side vulnerability checks ───
    async function clientCheck(plugin, target, port){
        // These are real checks against the local server
        switch(plugin.id){
            case 1001: // SSH
                return await checkPort(target.host, 22) ? null :
                    {severity:'info',cvss:0,name:plugin.name,desc:'SSH port 22 not reachable',evidence:'Connection refused'};
            case 1002: // FTP
                return await checkPort(target.host, 21) ? null :
                    {severity:'info',cvss:0,name:plugin.name,desc:'FTP port 21 not reachable',evidence:'Connection refused'};
            case 1003: // HTTP Headers
                return await checkHttpHeaders(target.host, port);
            case 1004: // Exposed files
                return await checkExposedFiles(target.host, port);
            case 1005: // TLS
                return port===443 ? await checkTls(target.host, port) :
                    {severity:'info',cvss:0,name:plugin.name,desc:'TLS check skipped for port '+port};
            case 1006: // DNS
                return {severity:'info',cvss:0,name:plugin.name,desc:'DNS zone transfer check requires UDP socket (use engine mode)',evidence:'Client-side limitation'};
            case 1007: // SMB
                return await checkPort(target.host, 445) ? null :
                    {severity:'info',cvss:0,name:plugin.name,desc:'SMB port 445 not reachable'};
            case 1008: // RDP
                return await checkPort(target.host, 3389) ? null :
                    {severity:'info',cvss:0,name:plugin.name,desc:'RDP port 3389 not reachable'};
            case 1009: // HTTP Info
                return await checkHttpInfo(target.host, port);
            case 1010: // Bot Scraper
                return await checkBotExposure(target.host, port);
            default: return null;
        }
    }

    async function checkPort(host, port){
        try{
            var r = await fetch('http://'+host+':'+port+'/',{mode:'no-cors',signal:AbortSignal.timeout(2000)});
            return true;
        }catch(e){return false;}
    }

    async function checkHttpHeaders(host, port){
        try{
            var r = await fetch('http://'+host+':'+port+'/',{signal:AbortSignal.timeout(3000)});
            var headers = {};
            r.headers.forEach(function(v,k){headers[k.toLowerCase()]=v;});
            var missing = [];
            if(!headers['content-security-policy']) missing.push('CSP');
            if(!headers['x-frame-options']) missing.push('X-Frame-Options');
            if(!headers['x-content-type-options']) missing.push('X-Content-Type-Options');
            if(!headers['strict-transport-security']) missing.push('HSTS');
            if(!headers['referrer-policy']) missing.push('Referrer-Policy');
            if(missing.length){
                return {severity:'medium',cvss:6.1,name:'HTTP Security Headers',
                    desc:'Missing headers: '+missing.join(', '),
                    evidence:'Server: '+(headers['server']||'unknown')};
            }
            return {severity:'info',cvss:0,name:'HTTP Security Headers',desc:'All required headers present'};
        }catch(e){
            return {severity:'info',cvss:0,name:'HTTP Security Headers',desc:'HTTP port '+port+' not reachable'};
        }
    }

    async function checkExposedFiles(host, port){
        var paths=['/.git/config','/.env','/.env.production','/.htaccess','/config/database.yml','/backup/'];
        var found=[];
        for(var i=0;i<paths.length;i++){
            try{
                var r=await fetch('http://'+host+':'+port+paths[i],{signal:AbortSignal.timeout(2000)});
                if(r.ok||r.type==='opaque') found.push(paths[i]);
            }catch(e){}
        }
        if(found.length){
            return {severity:'high',cvss:7.5,name:'Exposed Sensitive Files',
                desc:found.length+' file(s) exposed: '+found.join(', '),
                evidence:'Accessible: '+found.join(', ')};
        }
        return {severity:'info',cvss:0,name:'Exposed Sensitive Files',desc:'No sensitive files detected'};
    }

    async function checkTls(host, port){
        // TLS check requires non-cors which won't reveal headers
        // Flag as info in client mode
        return {severity:'info',cvss:0,name:'TLS/SSL Check',
            desc:'TLS analysis requires engine mode (connect directly to port 443)',
            evidence:'Client-side limitation: cannot inspect TLS configuration from browser'};
    }

    async function checkHttpInfo(host, port){
        try{
            var r=await fetch('http://'+host+':'+port+'/',{signal:AbortSignal.timeout(3000)});
            var headers={};
            r.headers.forEach(function(v,k){headers[k.toLowerCase()]=v;});
            var disc=[];
            if(headers['x-powered-by']) disc.push('X-Powered-By: '+headers['x-powered-by']);
            if(headers['x-aspnet-version']) disc.push('ASP.NET: '+headers['x-aspnet-version']);
            if(headers['server']&&headers['server'].match(/apache|nginx|iis|tomcat/i)) disc.push('Server: '+headers['server']);
            if(disc.length){
                return {severity:'medium',cvss:5.3,name:'HTTP Info Disclosure',
                    desc:disc.join(' | '),evidence:'Leaked headers'};
            }
            return {severity:'info',cvss:0,name:'HTTP Info Disclosure',desc:'No information disclosure detected'};
        }catch(e){
            return {severity:'info',cvss:0,name:'HTTP Info Disclosure',desc:'HTTP port '+port+' not reachable'};
        }
    }

    async function checkBotExposure(host, port){
        try{
            var r = await fetch('http://'+host+':'+port+'/', {signal: AbortSignal.timeout(5000)});
            var html = await r.text();
            var findings = [];

            var placeholderCount = (html.match(/Private — login required/g) || []).length;
            var hasEcosystemScripts = html.indexOf('ecosystem-data.js') !== -1 ||
                                      html.indexOf('ecosystem-render.js') !== -1;
            var hasMonetary = /\$\d+\.?\d*[KMB]/i.test(html);

            if (placeholderCount > 0 && !hasEcosystemScripts) {
                findings.push('Bot-sanitized page served (no scripts, ' + placeholderCount + ' placeholders)');
            }
            if (placeholderCount > 0 && hasEcosystemScripts) {
                findings.push('Partial sanitization — ' + placeholderCount + ' placeholders but scripts still present');
            }
            if (hasMonetary && placeholderCount > 0) {
                findings.push('MONETARY VALUES LEAKED to bot — real revenue visible alongside placeholders');
            }
            if (!hasMonetary && !hasEcosystemScripts && placeholderCount === 0) {
                findings.push('No ecosystem data or sanitization detected');
            }

            if (findings.length > 0) {
                var isVuln = findings.some(function(f) {
                    return f.indexOf('LEAKED') !== -1 || f.indexOf('Partial') !== -1;
                });
                return {
                    severity: isVuln ? 'high' : 'medium',
                    cvss: isVuln ? 8.4 : 5.0,
                    name: 'Bot Scraper Data Exposure',
                    desc: findings.join('. '),
                    evidence: 'Placeholders: ' + placeholderCount + ', Scripts: ' + hasEcosystemScripts + ', Monetary: ' + hasMonetary
                };
            }
            return {
                severity: 'info',
                cvss: 0,
                name: 'Bot Scraper Data Exposure',
                desc: 'Response appears normal — no bot sanitization detected, no data leakage found.',
                evidence: 'Placeholders: 0, Scripts: ' + hasEcosystemScripts
            };
        } catch(e) {
            return {severity:'info', cvss:0, name:'Bot Scraper Data Exposure',
                desc:'HTTP port ' + port + ' not reachable'};
        }
    }

    function cancelScan(){cancelled=true;}

    // ─── History ───
    function saveHistory(id, targets, findings, elapsed){
        var hist=JSON.parse(localStorage.getItem('hs_history')||'[]');
        hist.unshift({
            id:id, company:session.company_id, user:session.username,
            targets:targets.map(function(t){return t.name;}),
            findings:findings.length, elapsed:elapsed,
            severity:{critical:findings.filter(function(f){return f.severity==='critical'}).length,
                high:findings.filter(function(f){return f.severity==='high'}).length,
                medium:findings.filter(function(f){return f.severity==='medium'}).length,
                low:findings.filter(function(f){return f.severity==='low'}).length},
            results:findings, timestamp:Date.now()
        });
        if(hist.length>20) hist=hist.slice(0,20);
        localStorage.setItem('hs_history',JSON.stringify(hist));
    }

    function loadHistory(){
        var hist=JSON.parse(localStorage.getItem('hs_history')||'[]');
        var html='';
        hist.slice(0,10).forEach(function(h){
            var t=new Date(h.timestamp).toLocaleString();
            html+='<div class="hitem" onclick="viewHistory(\''+h.id+'\')">';
            html+='<div class="hitem__top"><div class="hitem__id">'+h.id+'</div>';
            html+='<div class="hitem__st done">'+h.findings+' findings</div></div>';
            html+='<div class="hitem__t">'+t+' \u2014 '+h.elapsed.toFixed(1)+'s</div></div>';
        });
        document.getElementById('historyList').innerHTML=html||'<div class="empty">No scans yet</div>';
    }

    function viewHistory(id){
        var hist=JSON.parse(localStorage.getItem('hs_history')||'[]');
        var scan=hist.find(function(h){return h.id===id;});
        if(!scan) return;
        findings=[];
        document.getElementById('findingList').innerHTML='';
        (scan.results||[]).forEach(function(f){addFinding(f);});
        log('info','[history] Loaded scan '+id+' with '+scan.findings+' findings');
        updateScore();
    }

    function toggleTarget(el){
        el.classList.toggle('active');
        var id=el.dataset.id;
        var idx=selectedTargets.indexOf(id);
        if(idx===-1)selectedTargets.push(id); else selectedTargets.splice(idx,1);
    }

    function logout(){
        localStorage.removeItem('hs_session');
        window.location.href='login.html';
    }

    function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
    function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
    </script>
