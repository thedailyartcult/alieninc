name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build - inject API base for laptop backend
        run: |
          echo "Frontend is static - no build needed"
          echo "API base will be https://api.alieninc.tech (via Cloudflare Tunnel to laptop :8000)"
          cat CNAME
          rm -rf _pages && mkdir -p _pages
          cp -r index.html 404.html CNAME assets _pages/ 2>/dev/null || true
          cp -r mission.html privacy.html terms.html founder.html about.html cookies.html dashboard.html _pages/ 2>/dev/null || true
          cp -r articles _pages/articles 2>/dev/null || true
          cp -f .nojekyll _pages/.nojekyll 2>/dev/null || true
          # Favicons + branding — required for alieninc.tech tab icon
          for f in ai-favicon.svg ai-favicon-16.png ai-favicon-32.png ai-favicon-180.png ai-favicon-light-16.png ai-favicon-light-32.png favicon.ico new.png logo.png; do cp -v "$f" _pages/ 2>&1 || true; done
          cp -v *.svg _pages/ 2>&1 | head -n 20 || true
          # Founder / hero media — required for founder.html (founder.jpeg 404 was missing from _pages)
          cp -v *.jpeg *.jpg *.mp4 _pages/ 2>&1 | head -n 20 || true
          # Panteon site — copy self-contained frontend (play.html, index.html, etc.) without heavy backups
          mkdir -p _pages/panteon
          rsync -a --exclude='*.bak*' --exclude='.git' --exclude='backend' --exclude='__pycache__' --exclude='*.db' --exclude='*.db-*' --exclude='data' --exclude='logs' --exclude='*.log' --exclude='*.jsonl' panteon/ _pages/panteon/ 2>/dev/null || cp -r panteon _pages/panteon 2>/dev/null || true
          # Ensure play.html is always present even if rsync filtered aggressively
          cp -f panteon/play.html _pages/panteon/play.html 2>/dev/null || true
          cp -f panteon/index.html _pages/panteon/index.html 2>/dev/null || true
          cat > _pages/config.js << 'JS'
          window.ALIENINC_CONFIG = {
            API_BASE: "https://api.alieninc.tech",
            PANTEON_API: "https://api.alieninc.tech/api/v1",
            SUPABASE_URL: "https://frwjaixxlgthkgjtafhz.supabase.co"
          };
          JS
          cat _pages/config.js
          cat _pages/CNAME; ls -lh _pages/*.html | head -n 20
          # Sitemap: auto-generate with lastmod from git log (102+ URLs, covers alieninc.tech + panteon.alieninc.tech)
          python3 tools/generate-sitemap.py || echo "sitemap gen failed"
          cp -v sitemap.xml _pages/sitemap.xml 2>&1 || true
          cp -v robots.txt _pages/robots.txt 2>&1 || true
          cp -v sitemap.xml _pages/panteon/sitemap.xml 2>&1 || true
          echo "Sitemap URLs: $(grep -c '<loc>' _pages/sitemap.xml)"; head -20 _pages/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deploy - Panteon must be 200 for Googlebot
        run: |
          echo "Waiting 30s for Pages to propagate..."
          sleep 30
          for url in "https://alieninc.tech/" "https://alieninc.tech/panteon/" "https://panteon.alieninc.tech/" "https://panteon.alieninc.tech/play.html" "https://alieninc.tech/sitemap.xml"; do
            echo "Checking $url..."
            code=$(curl -s -o /tmp/out.html -w "%{http_code}" --max-time 20 "$url")
            echo "HTTP $code for $url"
            if [ "$code" != "200" ]; then echo "FAIL $url got $code"; cat /tmp/out.html | head -30; exit 1; fi
          done
          if ! grep -q "Panteon" /tmp/out.html; then echo "WARN content check"; fi
          echo "All URLs 200 OK - safe for Google crawl"

      - name: IndexNow ping (Bing/Yandex) + Search Console hint
        if: always()
        run: |
          echo "Pinging IndexNow for sitemap..."
          # IndexNow: notifies Bing/Yandex instantly (no key needed for sitemap ping, but we also do per-URL)
          curl -s "https://www.bing.com/indexnow?url=https://alieninc.tech/sitemap.xml" --max-time 10 || true
          curl -s "https://yandex.com/indexnow?url=https://alieninc.tech/sitemap.xml" --max-time 10 || true
          # Google Indexing API: requires secrets.GOOGLE_SERVICE_ACCOUNT_JSON + verified property
          # If secret is set, submit key URLs via googleapis
          if [ -n "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "Submitting to Google Indexing API..."
            echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > /tmp/gsa.json
            pip install -q google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client 2>&1 | tail -1
            python3 tools/submit-indexing.py || echo "Google indexing submit failed (check service account)"
          else
            echo "Skipping Google Indexing API (add GOOGLE_SERVICE_ACCOUNT_JSON secret to enable)"
            echo "Manually: Search Console > Sitemaps > submit https://alieninc.tech/sitemap.xml"
          fi
