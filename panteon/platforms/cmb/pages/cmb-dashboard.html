<!-- Platform: cmb | Page: cmb-dashboard | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-cmb-dashboard'. -->
<div class="page" id="page-cmb-dashboard">
                    <div style="display:flex;flex-direction:column;height:calc(100vh - 68px)">
                        <div class="cmb-section-header" style="margin-bottom:16px">
                            <div style="display:flex;align-items:center;gap:16px">
                                <h2 class="cmb-section-title cmb-reveal">Memory Dashboard</h2>
                                <div style="display:flex;align-items:center;gap:10px">
                                    <span class="status-dot" id="cmbEngineDot" style="background:var(--text-muted)"></span>
                                    <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted)" id="cmbEngineStatus">Checking engine...</span>
                                </div>
                            </div>
                            <div style="display:flex;gap:12px">
                                <button class="cmb-btn cmb-btn-sm" onclick="reloadCMB()">
                                    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8a6 6 0 0 1 10.5-4M14 8a6 6 0 0 1-10.5 4"/><path d="M12 2v4h-4M4 14v-4h4"/></svg>
                                    Reload
                                </button>
                                <button class="cmb-btn cmb-btn-sm" onclick="openCMBExternal()">
                                    Open Full
                                    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h8v8M14 2L6 10"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="cmb-card" style="flex:1;padding:0;overflow:hidden">
                            <iframe id="cmbFrame" style="width:100%;height:100%;border:none;background:var(--bg-card)" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="CMB Memory Dashboard"></iframe>
                        </div>
                    </div>
                </div>
