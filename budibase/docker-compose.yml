# CENTRA Self-Service Portal — Budibase self-hosted stack
# Deploy: docker compose up -d
# No external CDN. All services bind to an isolated bridge network.
# Designed for CMMC Level 2 isolation (TLS, internal SMTP, volume encryption handled at host level).

services:
  couchdb-service:
    image: couchdb:3
    container_name: centra-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCH_DB_USER}
      COUCHDB_PASSWORD: ${COUCH_DB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-service:
    image: redis:7-alpine
    container_name: centra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-service:
    image: minio/minio
    container_name: centra-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER: "off"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  worker-service:
    image: budibase/worker
    container_name: centra-budibase-worker
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      PORT: 4003
      CLUSTER_PORT: ${MAIN_PORT}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_URL: http://minio-service:9000
      APPS_URL: http://app-service:4002
      COUCH_DB_USERNAME: ${COUCH_DB_USER}
      COUCH_DB_PASSWORD: ${COUCH_DB_PASSWORD}
      COUCH_DB_URL: http://${COUCH_DB_USER}:${COUCH_DB_PASSWORD}@couchdb-service:5984
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis-service:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OFFLINE_MODE: "true"
      ENABLE_ANALYTICS: "false"
      BB_ADMIN_USER_EMAIL: ${BB_ADMIN_USER_EMAIL}
      BB_ADMIN_USER_PASSWORD: ${BB_ADMIN_USER_PASSWORD}
      # Internal SMTP relay only
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      - redis-service
      - minio-service
      - couchdb-service
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 512M

  app-service:
    image: budibase/apps
    container_name: centra-budibase-app
    restart: unless-stopped
    environment:
      SELF_HOSTED: 1
      COUCH_DB_URL: http://${COUCH_DB_USER}:${COUCH_DB_PASSWORD}@couchdb-service:5984
      WORKER_URL: http://worker-service:4003
      MINIO_URL: http://minio-service:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BUDIBASE_ENVIRONMENT: PRODUCTION
      PORT: 4002
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
      ENABLE_ANALYTICS: "false"
      REDIS_URL: redis-service:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OFFLINE_MODE: "true"
      PLUGINS_DIR: /plugins
      BB_ADMIN_USER_EMAIL: ${BB_ADMIN_USER_EMAIL}
      BB_ADMIN_USER_PASSWORD: ${BB_ADMIN_USER_PASSWORD}
    depends_on:
      - worker-service
      - redis-service
      - minio-service
      - couchdb-service
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 768M

  proxy-service:
    image: budibase/proxy
    container_name: centra-budibase-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIN_PORT}:10000"
    environment:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: 10
      PROXY_RATE_LIMIT_API_PER_SECOND: 50
      APPS_UPSTREAM_URL: http://app-service:4002
      WORKER_UPSTREAM_URL: http://worker-service:4003
      MINIO_UPSTREAM_URL: http://minio-service:9000
      COUCHDB_UPSTREAM_URL: http://couchdb-service:5984
      RESOLVER: 127.0.0.11
    depends_on:
      - minio-service
      - worker-service
      - app-service
    networks:
      - centra-budibase
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  centra-budibase:
    driver: bridge
    internal: true

volumes:
  couchdb_data:
  redis_data:
  minio_data:
