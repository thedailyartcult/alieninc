<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Library | CENTRA</title>
    <meta name="description" content="Search Centra's library of 275,000+ vulnerability detection plugins covering CVEs from 2017 to 2026.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Sans+Condensed:wght@700;800&family=Orbitron:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        :root{--aliendot:#ffd400;--bg:#f9fafb;--surface:#fff;--border:#eaecf0;--border-strong:#d0d5dd;--text:#101828;--text-secondary:#475467;--text-muted:#98a2b3;--accent:#1e2124;--accent-hover:#353a40;--focus:#b2ddff}
        *{box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;display:flex;flex-direction:column}
        .font-body{font-family:'Instrument Sans','Inter',sans-serif}
        .brand-logo{display:flex;align-items:center;gap:.12rem;text-decoration:none}
        .brand-logo__text{font-family:"Ultra","Alfa Slab One","Clarendon","Egyptian 714","Rockwell Extra Bold",serif;font-size:clamp(24px,5vw,29px);font-weight:500;letter-spacing:.02em;color:#131920;line-height:1}
        .brand-logo__dot{height:.56em;width:.56em;position:relative;top:calc(.30*clamp(24px,5vw,29px));display:block}

        .sev{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;line-height:1.4}
        .sev::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
        .sev-critical{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.sev-critical::before{background:#ef4444}
        .sev-high{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.sev-high::before{background:#f97316}
        .sev-medium{background:#fefce8;color:#854d0e;border:1px solid #fef08a}.sev-medium::before{background:#eab308}
        .sev-low{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.sev-low::before{background:#22c55e}
        .sev-info{background:#f0f9ff;color:#075985;border:1px solid #bae6fd}.sev-info::before{background:#3b82f6}

        .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all .12s ease;white-space:nowrap;user-select:none}
        .chip:hover{background:#f3f4f6;border-color:#9ca3af}
        .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .chip .count{color:var(--text-muted);font-weight:400;font-size:11px}
        .chip.active .count{color:rgba(255,255,255,.6)}

        .row{display:grid;grid-template-columns:80px 1fr 180px 70px 100px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #f2f4f7;cursor:pointer;transition:background .08s ease}
        .row:hover{background:#f8fafc}
        @media(max-width:768px){.row{grid-template-columns:60px 1fr 70px;gap:8px;padding:10px 14px}.row .r-family,.row .r-cvss{display:none}}

        .row-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--text-secondary)}
        .row-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .row-desc{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
        .row-family{font-size:12px;color:var(--text-secondary)}
        .row-cvss{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
        .row-sev{display:flex;justify-content:flex-end}

        .loader{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .5s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        .stat{transition:all .12s ease}.stat:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.05)}

        .kbd{display:inline-flex;align-items:center;padding:1px 5px;font-size:10px;font-family:ui-monospace,monospace;color:var(--text-muted);background:#f9fafb;border:1px solid var(--border);border-radius:3px;line-height:1.6}

        #results{min-height:400px}
        .sentinel{height:1px}
        .threat-pulse{width:7px;height:7px;background:#f04438;border-radius:50%;display:inline-block;animation:threatPulse 1.6s ease-in-out infinite;flex-shrink:0}
        @keyframes threatPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(240,68,56,.55)}50%{opacity:.65;box-shadow:0 0 0 5px rgba(240,68,56,0)}}
        .ru-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;white-space:nowrap;cursor:pointer;transition:background .12s ease}
        .ru-chip:hover{background:rgba(255,255,255,.14)}
        .ru-ver{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#7ef0c2;background:rgba(16,185,129,.15);border-radius:4px;padding:1px 5px}
        .ru-date{font-size:11px;color:rgba(255,255,255,.55)}
    </style>
</head>

05 -3.1256,14.296 -1.7926,15.077 1.3395,0.78418 21.593,1.4453 33.376,1.0894 z" fill="#131920"/>

                    <text x="84" y="44" class="centra-logo-text" fill="#131920" letter-spacing="1">CENTR<tspan fill="#00FFFF">A</tspan><tspan font-size="12" dy="-14" fill="#00FFFF">™</tspan></text>
                </svg>
            </div>
            <span class="text-xs text-gray-400">Secured by Centra</span>
            <span class="text-xs text-gray-300 mx-2">&middot;</span>
            <span class="text-xs text-gray-400">Vulnerability Scanning &amp; Compliance Monitoring</span>
            <div class="mt-2 text-[10px] text-gray-300">A subsidiary of Alien Inc &reg;</div>
        </div>
    </footer>

    <div id="modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center" style="background:rgba(0,0,0,.45);backdrop-filter:blur(4px)">
        <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full mx-4 max-h-[80vh] overflow-y-auto border border-[#eaecf0]">
            <div class="sticky top-0 bg-white border-b border-[#eaecf0] px-5 py-3.5 flex items-center justify-between rounded-t-xl z-10">
                <h3 class="text-sm font-semibold text-[#101828]" id="mTitle"></h3>
                <button onclick="closeModal()" class="text-[#98a2b3] hover:text-[#475467] text-xl leading-none w-7 h-7 flex items-center justify-center rounded hover:bg-gray-100 transition">&times;</button>
            </div>
            <div class="px-5 py-4" id="mBody"></div>
        </div>
    </div>

    <script id="initialData" type="application/json">{%INITIAL_DATA%}</script>

    <script>
    (function(){
        const PER_PAGE = 50;
        const $ = id => document.getElementById(id);
        const initial = JSON.parse($('initialData').textContent);

        let state = { q:'', family:'', severity:'', sort:'newest', page:1, total:0, totalPlugins:initial.total_plugins, loading:false, hasMore:true };
        let cache = {};
        let debounceTimer = null;

        function init() {
            restoreState();
            renderStats();
            renderFamilies();
            loadRecentUpdates();
            if (state.q || state.family || state.severity) {
                fetchPage(true);
            } else {
                renderInitial();
            }
            bind();
        }

        function restoreState() {
            const p = new URLSearchParams(location.search);
            if (p.get('q')) state.q = p.get('q');
            if (p.get('family')) state.family = p.get('family');
            if (p.get('severity')) state.severity = p.get('severity');
            if (p.get('sort')) state.sort = p.get('sort');
            $('q').value = state.q;
            $('sev').value = state.severity;
            $('sort').value = state.sort;
            if (state.q) $('clearBtn').classList.remove('hidden');
            if (state.family) highlightFamily(state.family);
        }

        function pushState() {
            const p = new URLSearchParams();
            if (state.q) p.set('q', state.q);
            if (state.family) p.set('family', state.family);
            if (state.severity) p.set('severity', state.severity);
            if (state.sort && state.sort !== 'newest') p.set('sort', state.sort);
            const qs = p.toString();
            history.replaceState(null, '', qs ? '?' + qs : location.pathname);
        }

        function renderStats() {
            const s = initial.severities;
            $('stats').innerHTML = [
                stat(initial.total_plugins.toLocaleString(), 'Total Plugins', '#101828'),
                stat((s.Critical||0).toLocaleString(), 'Critical', '#991b1b'),
                stat((s.High||0).toLocaleString(), 'High', '#9a3412'),
                stat((s.Medium||0).toLocaleString(), 'Medium', '#854d0e'),
                stat(Object.keys(initial.families).length, 'Families', '#101828'),
            ].join('');
        }

        function stat(val, label, color) {
            return '<div class="stat bg-white border border-[#d0d5dd] rounded-lg p-3 text-center cursor-default"><div class="text-xl font-bold" style="color:'+color+'">'+val+'</div><div class="text-[11px] text-[#475467] mt-0.5">'+label+'</div></div>';
        }

        function renderFamilies() {
            const sorted = Object.entries(initial.families).sort((a,b) => b[1]-a[1]).slice(0, 20);
            let html = '<button class="chip'+(state.family===''?' active':'')+'" data-f="">All <span class="count">'+initial.total_plugins.toLocaleString()+'</span></button>';
            for (const [f,c] of sorted) {
                const active = state.family === f ? ' active' : '';
                html += '<button class="chip'+active+'" data-f="'+esc(f)+'">'+esc(f)+' <span class="count">'+c.toLocaleString()+'</span></button>';
            }
            $('families').innerHTML = html;
        }

        function highlightFamily(f) {
            document.querySelectorAll('#families .chip').forEach(el => {
                el.classList.toggle('active', el.dataset.f === f);
            });
        }

        function renderInitial() {
            state.totalPlugins = initial.total_plugins;
            const items = initial.recent;
            $('resultInfo').textContent = initial.total_plugins.toLocaleString() + ' plugins — showing newest';
            renderRows(items, false);
            state.hasMore = true;
            state.page = 1;
            state.total = initial.total_plugins;
            $('liveCount').innerHTML = '<svg class="w-3.5 h-3.5 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span>Live</span>';
        }

        function renderRows(items, append) {
            const el = $('results');
            let html = append ? el.innerHTML : '';
            for (const p of items) {
                const name = p.name || (p.cve && p.cve[0]) || 'Plugin ' + p.id;
                const metaBits = [];
                if (p.version) metaBits.push('<span class="ru-ver" style="background:rgba(16,185,129,.12);color:#0e9f6e;">v'+esc(p.version)+'</span>');
                if (p.updated_date) metaBits.push('<span class="ru-date" style="color:#98a2b3;font-size:11px;">upd '+esc(p.updated_date)+'</span>');
                html += '<div class="row" onclick="showPlugin('+p.id+')">'
                    + '<div class="row-id">'+p.id+'</div>'
                    + '<div class="min-w-0"><div class="row-name">'+esc(name)+' '+metaBits.join(' ')+'</div>'
                    + (p.description ? '<div class="row-desc">'+esc(p.description.substring(0,100))+'</div>' : '')
                    + '</div>'
                    + '<div class="row-family">'+esc(p.family)+'</div>'
                    + '<div class="row-cvss" style="color:'+cvssColor(p.cvss)+'">'+p.cvss.toFixed(1)+'</div>'
                    + '<div class="row-sev">'+sevBadge(p.severity)+'</div>'
                    + '</div>';
            }
            el.innerHTML = html;
        }

        function loadRecentUpdates() {
            fetch('/api/plugins/recently-updated?limit=8')
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data || !data.results || !data.results.length) return;
                    const wrap = $('recentUpdates');
                    const row = $('recentUpdatesRow');
                    const cnt = $('ruCount');
                    if (cnt && data.updated_24h !== undefined) cnt.textContent = data.updated_24h.toLocaleString() + ' updated in the last 24h';
                    row.innerHTML = data.results.map(p =>
                        '<div class="ru-chip" onclick="showPlugin(' + p.id + ')">'
                        + '<span style="font-size:12px;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis">' + esc(p.name || '') + '</span>'
                        + (p.version ? '<span class="ru-ver">v' + esc(p.version) + '</span>' : '')
                        + '<span class="ru-date">' + esc(p.updated_date || '') + '</span>'
                        + '</div>'
                    ).join('');
                    wrap.style.display = 'block';
                })
                .catch(() => {});
        }

        function renderSkeleton(n) {
            let html = '';
            for (let i = 0; i < n; i++) {
                html += '<div class="row" style="cursor:default"><div class="skeleton h-4 w-12"></div><div><div class="skeleton h-4 w-64 mb-1.5"></div><div class="skeleton h-3 w-48"></div></div><div class="skeleton h-4 w-24"></div><div class="skeleton h-4 w-10"></div><div class="skeleton h-5 w-14 rounded-full"></div></div>';
            }
            $('results').innerHTML = html;
        }

        async function fetchPage(reset) {
            if (state.loading) return;
            if (!reset && !state.hasMore) return;

            if (reset) {
                state.page = 1;
                state.hasMore = true;
                cache = {};
                renderSkeleton(8);
            } else {
                $('loadMore').classList.remove('hidden');
            }

            state.loading = true;
            const key = state.q+'|'+state.family+'|'+state.severity+'|'+state.sort+'|'+state.page;

            try {
                let data;
                if (cache[key]) {
                    data = cache[key];
                } else {
                    const params = new URLSearchParams({ page: state.page, per_page: PER_PAGE, sort: state.sort });
                    if (state.q) params.set('q', state.q);
                    if (state.family) params.set('family', state.family);
                    if (state.severity) params.set('severity', state.severity);
                    const res = await fetch('/api/plugins/search?' + params);
                    data = await res.json();
                    cache[key] = data;
                }

                state.total = data.total;
                state.totalPlugins = data.total_plugins || state.totalPlugins;

                const start = (state.page - 1) * PER_PAGE + 1;
                const end = Math.min(state.page * PER_PAGE, data.total);
                $('resultInfo').textContent = data.total.toLocaleString() + ' result' + (data.total !== 1 ? 's' : '') + ' — showing ' + start.toLocaleString() + '–' + end.toLocaleString();

                renderRows(data.results, !reset);

                state.hasMore = end < data.total;
                $('loadMore').classList.add('hidden');
                $('endMessage').classList.toggle('hidden', state.hasMore);

                if (data.families && !reset) renderFamilies();

            } catch (err) {
                $('resultInfo').textContent = 'Search failed — retrying...';
                setTimeout(() => fetchPage(reset), 1000);
            }

            state.loading = false;
            pushState();
        }

        function bind() {
            $('q').addEventListener('input', function() {
                const v = this.value.trim();
                $('clearBtn').classList.toggle('hidden', !v);
                if (v === state.q) return;
                state.q = v;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fetchPage(true), 100);
            });

            $('clearBtn').addEventListener('click', function() {
                $('q').value = '';
                state.q = '';
                this.classList.add('hidden');
                fetchPage(true);
                $('q').focus();
            });

            $('sev').addEventListener('change', function() {
                state.severity = this.value;
                fetchPage(true);
            });

            $('sort').addEventListener('change', function() {
                state.sort = this.value;
                fetchPage(true);
            });

            $('families').addEventListener('click', function(e) {
                const chip = e.target.closest('.chip');
                if (!chip) return;
                state.family = chip.dataset.f;
                document.querySelectorAll('#families .chip').forEach(el => el.classList.toggle('active', el.dataset.f === state.family));
                fetchPage(true);
            });

            const sentinel = document.createElement('div');
            sentinel.className = 'sentinel';
            $('results').parentNode.insertBefore(sentinel, $('loadMore'));

            const io = new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && state.hasMore && !state.loading) {
                    state.page++;
                    fetchPage(false);
                }
            }, { rootMargin: '200px' });
            io.observe(sentinel);

            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement !== $('q')) {
                    e.preventDefault();
                    $('q').focus();
                    $('q').select();
                }
                if (e.key === 'Escape') {
                    closeModal();
                    $('q').blur();
                }
            });

            $('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

            window.addEventListener('popstate', function() {
                const p = new URLSearchParams(location.search);
                state.q = p.get('q') || '';
                state.family = p.get('family') || '';
                state.severity = p.get('severity') || '';
                state.sort = p.get('sort') || 'newest';
                $('q').value = state.q;
                $('sev').value = state.severity;
                $('sort').value = state.sort;
                $('clearBtn').classList.toggle('hidden', !state.q);
                highlightFamily(state.family);
                fetchPage(true);
            });
        }

        window.showPlugin = async function(id) {
            const m = $('modal');
            m.classList.remove('hidden');
            $('mTitle').textContent = 'Plugin ' + id;
            $('mBody').innerHTML = '<div class="py-8"><div class="skeleton h-6 w-32 mx-auto mb-3"></div><div class="skeleton h-4 w-full mb-2"></div><div class="skeleton h-4 w-3/4"></div></div>';

            try {
                const key = 'detail_' + id;
                let d;
                if (cache[key]) { d = cache[key]; }
                else {
                    const res = await fetch('/api/plugins/' + id);
                    d = await res.json();
                    cache[key] = d;
                }
                if (d.error) { $('mBody').innerHTML = '<p class="text-red-500 text-sm">'+d.error+'</p>'; return; }

                $('mTitle').textContent = 'Plugin ' + d.id;
                const cves = (d.cve && d.cve.length) ? d.cve.map(c => '<a href="https://nvd.nist.gov/vuln/detail/'+c+'" target="_blank" rel="noopener" class="text-blue-600 hover:underline font-mono text-sm">'+c+'</a>').join(', ') : '<span class="text-[#98a2b3]">None</span>';

                $('mBody').innerHTML = ''
                    + '<div class="flex items-center gap-3 mb-4">'
                    + '<span class="text-3xl font-bold" style="color:'+cvssColor(d.cvss)+'">'+d.cvss.toFixed(1)+'</span>'
                    + sevBadge(d.severity)
                    + '</div>'
                    + '<h4 class="text-base font-semibold text-[#101828] mb-1.5">'+esc(d.name || 'Plugin '+d.id)+'</h4>'
                    + '<p class="text-sm text-[#475467] mb-5 leading-relaxed">'+esc(d.description || 'No description available.')+'</p>'
                    + '<div class="grid grid-cols-2 gap-y-4 gap-x-6 text-sm border-t border-[#eaecf0] pt-4">'
                    + '<div><div class="text-[11px] font-medium text-[#98a2b3] uppercase tracking-wider mb-1">Family</div><div class="text-[#101828]">'+esc(d.family)+'</div></div>'
                    + '<div><div class="text-[11px] font-medium text-[#98a2b3] uppercase tracking-wider mb-1">Ports</div><div class="text-[#101828] font-mono text-xs">'+esc(d.ports||'N/A')+'</div></div>'
                    + '<div class="col-span-2"><div class="text-[11px] font-medium text-[#98a2b3] uppercase tracking-wider mb-1">CVE References</div><div>'+cves+'</div></div>'
                    + (d.solution ? '<div class="col-span-2"><div class="text-[11px] font-medium text-[#98a2b3] uppercase tracking-wider mb-1">Solution</div><div class="text-[#101828]">'+esc(d.solution)+'</div></div>' : '')
                    + '</div>';
            } catch(e) {
                $('mBody').innerHTML = '<p class="text-red-500 text-sm">Failed to load.</p>';
            }
        };

        window.closeModal = function(){ $('modal').classList.add('hidden'); };

        function sevBadge(s) {
            const cls = {Critical:'sev-critical',High:'sev-high',Medium:'sev-medium',Low:'sev-low',Info:'sev-info'}[s] || 'sev-info';
            return '<span class="sev '+cls+'">'+(s||'?')+'</span>';
        }
        function cvssColor(v) {
            if (v >= 9) return '#991b1b';
            if (v >= 7) return '#9a3412';
            if (v >= 4) return '#854d0e';
            if (v >= .1) return '#166534';
            return '#475467';
        }
        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        init();
    })();
    </script>
</body>
</html>
