name: Uptime - Panteon Googlebot check
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 min
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check panteon is 200 (laptop-independent)
        run: |
          set -e
          # NOTE: thedailyartcult.lol is served via the tdac-proxy Worker (not Pages)
          # and its Cloudflare WAF intermittently 403s GitHub runner IPs while real
          # browsers get 200 — warn-only, must not page/fail the uptime check.
          for url in "https://alieninc.tech/" "https://alieninc.tech/sitemap.xml" "https://panteon.alieninc.tech/" "https://alieninc.tech/panteon/" "https://panteon.alieninc.tech/play.html" "https://a-san.alieninc.tech/" "https://centra.alieninc.tech/" "https://genesis.alieninc.tech/" "https://immanuel.alieninc.tech/" "https://kmt.alieninc.tech/" "https://rousseau.alieninc.tech/" "https://secure.alieninc.tech/"; do
            echo "GET $url"
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 15 -A "Googlebot/2.1 (+http://www.google.com/bot.html)" "$url")
            echo "-> $code"
            if [ "$code" != "200" ]; then echo "FAIL $code"; cat /tmp/body.html | head -50; exit 1; fi
          done
          for url in "https://thedailyartcult.lol" "https://www.thedailyartcult.lol"; do
            echo "GET $url (warn-only)"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "Googlebot/2.1 (+http://www.google.com/bot.html)" "$url" || echo "000")
            echo "-> $code (warn-only, Worker-served)"
          done
          echo "All panteon checks 200 - worker x-panteon-worker + github origin OK"
          curl -sI https://panteon.alieninc.tech/ | grep -i "x-panteon\|cf-ray" || true

      - name: Notify on failure (creates issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Panteon down ${new Date().toISOString()}`;
            const body = `Automated uptime check failed for panteon.alieninc.tech at ${new Date().toISOString()}. Check Cloudflare Worker panteon-proxy and GitHub Pages deploy.`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["incident"] });
