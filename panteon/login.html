<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Panteon — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #000000;
            --bg-card: #0a0a0a;
            --text: #ffffff;
            --text-muted: #88898c;
            --text-dim: #555555;
            --accent: #DFF140;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --font-sans: "Inter", -apple-system, sans-serif;
            --font-tech: "Space Grotesk", monospace;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 48px;
        }

        .logo-wrap svg {
            width: 180px;
            height: auto;
            color: var(--text);
        }

        .login-title {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .login-sub {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-family: var(--font-tech);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--text);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
            background: #111;
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .login-btn {
            width: 100%;
            padding: 13px 24px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-sans);
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            transform: scale(0.99);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            font-size: 12px;
            color: #f87171;
            margin-top: 12px;
            min-height: 18px;
            text-align: center;
        }

        .success-msg {
            font-size: 12px;
            color: var(--accent);
            margin-top: 12px;
            min-height: 18px;
            text-align: center;
        }

        .footer-note {
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 40px;
            line-height: 1.6;
        }

        .footer-note a {
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 1px;
            transition: color 0.2s, border-color 0.2s;
        }

        .footer-note a:hover {
            color: var(--text);
            border-color: var(--border-hover);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .logo-wrap svg {
                width: 140px;
            }

            .login-title {
                font-size: 18px;
            }
        }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://*.supabase.co">
</head>
<body>

    <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
        <defs>
            <filter id="panteon-brush" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.23" numOctaves="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.85" xChannelSelector="R" yChannelSelector="B"/></filter>
            <mask id="panteon-roll"><rect width="100" height="100" fill="white"/><path d="M16 60 C20 58 24 59 27 63" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/></mask>
            <g id="panteon-lockup" fill="currentColor"><g filter="url(#panteon-brush)"><path d="M63 19 C57 19 54 23 54 29 L54 55 C54 59 56 62 60 64 L46 64 C42 64 40 66 40 68 C41 70 44 70 48 70 L65 70 C69 70 72 67 72 63 L72 29 C72 23 69 19 63 19 Z"/><circle cx="20" cy="64" r="7" mask="url(#panteon-roll)"/></g><text x="82" y="67" fill="currentColor" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500" letter-spacing="1.5">PANTEON</text></g>
        </defs>
    </svg>

    <div class="login-container">
        <div class="logo-wrap">
            <svg viewBox="0 0 295 100" role="img" aria-label="Panteon"><use href="#panteon-lockup"/></svg>
        </div>

        <h1 class="login-title">Admin Console</h1>
        <p class="login-sub">Sign in to access your dashboard</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@alieninc.tech" required autofocus autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
        </form>

        <p class="footer-note">
            Need access? <a href="mailto:admin@alieninc.tech">Contact admin</a>
        </p>
    </div>

    <script>
        var SUPABASE_URL = 'https://frwjaixxlgthkgjtafhz.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyd2phaXh4bGd0aGtnanRhZmh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDUzNDQsImV4cCI6MjA5NDYyMTM0NH0.j2DKz__QMml4WplMYNmsQpTUw0qu-kZG7Md3qBEEdEc';

        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('errorMsg');
            var successMsg = document.getElementById('successMsg');
            var emailInput = document.getElementById('email');
            var passwordInput = document.getElementById('password');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var email = emailInput.value.trim();
                var password = passwordInput.value;

                if (!email || !password) {
                    errorMsg.textContent = 'Please enter email and password';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Signing in...';
                errorMsg.textContent = '';
                successMsg.textContent = '';

                fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                })
                .then(function(resp) { return resp.json().then(function(data) { return { ok: resp.ok, data: data }; }); })
                .then(function(result) {
                    if (!result.ok) {
                        errorMsg.textContent = result.data.error_description || result.data.msg || 'Invalid credentials';
                        btn.disabled = false;
                        btn.textContent = 'Sign In';
                        return;
                    }
                    localStorage.setItem('hs_session', JSON.stringify({
                        username: result.data.user.email,
                        user_id: result.data.user.id,
                        access_token: result.data.access_token,
                        refresh_token: result.data.refresh_token,
                        company_id: 'alieninc'
                    }));
                    successMsg.textContent = 'Signed in successfully.';
                    setTimeout(function() {
                        window.location.href = '/admin';
                    }, 500);
                })
                .catch(function(err) {
                    errorMsg.textContent = 'Login error: ' + err.message;
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                });
            });
        });
    </script>

</body>
</html>
