<!-- Platform: cmb | Page: cmb-history | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-cmb-history'. -->
<div class="page" id="page-cmb-history">
                    <div class="cmb-section-header">
                        <div>
                            <h2 class="cmb-section-title cmb-reveal">Timeline</h2>
                            <p style="font-size:0.88rem;color:var(--text-muted);margin-top:8px">Bi-temporal history — what CMB believed, and when it changed</p>
                        </div>
                        <div class="cmb-section-badge">HISTORY</div>
                    </div>
                    <div class="cmb-card cmb-reveal" style="margin-bottom:32px">
                        <div class="cmb-card-header">
                            <div class="square-block"></div>
                            <div class="card-label">Search</div>
                        </div>
                        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
                            <input id="cmbHistQuery" type="text" placeholder="Query a fact, e.g. nginx config" style="flex:1;min-width:240px;background:var(--bg-input);border:1px solid var(--border-color);color:var(--text);padding:10px 14px;font-size:0.88rem;outline:none;transition:border-color 0.2s" />
                            <select id="cmbHistWs" style="background:var(--bg-input);border:1px solid var(--border-color);color:var(--text);padding:10px 14px;font-size:0.88rem;outline:none"></select>
                            <button class="cmb-btn cmb-btn-sm" onclick="loadCMBHistory()">
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
                                Search
                            </button>
                            <label style="display:flex;align-items:center;gap:8px;font-size:0.88rem;color:var(--text-muted);cursor:pointer">
                                <input type="checkbox" id="cmbHistWhy" style="accent-color:var(--accent-neon)" /> Show supersession (why)
                            </label>
                        </div>
                    </div>
                    <div class="cmb-card cmb-reveal">
                        <div class="cmb-card-header">
                            <div class="square-block"></div>
                            <div class="card-label" id="cmbHistTitle">History</div>
                        </div>
                        <div id="cmbHistory" style="font-size:0.88rem;line-height:1.6"><div class="empty-state" style="padding:24px 0">Enter a query and press Search to see the versions of a fact.</div></div>
                    </div>
                </div>
