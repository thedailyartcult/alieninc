name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build - inject API base for laptop backend
        run: |
          echo "Frontend is static - no build needed"
          echo "API base will be https://api.alieninc.tech (via Cloudflare Tunnel to laptop :8000)"
          # Verify CNAME exists
          cat CNAME
          # Optional: create config.js with API base for frontend to use
          cat > config.js << 'JS'
          // Auto-generated by Pages workflow - points frontend to laptop backend via tunnel
          window.ALIENINC_CONFIG = {
            API_BASE: "https://api.alieninc.tech",
            PANTEON_API: "https://api.alieninc.tech/api/v1",
            SUPABASE_URL: "https://frwjaixxlgthkgjtafhz.supabase.co"
          };
          JS
          cat config.js
          ls -lh *.html | head -n 10

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
