# Alien Inc — NGINX Reverse Proxy Configuration
# Deploy: sudo cp alieninc.conf /etc/nginx/sites-available/alieninc
#         sudo ln -s /etc/nginx/sites-available/alieninc /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# SSL: Use Cloudflare Origin CA cert (Dashboard → SSL/TLS → Origin Server)
#      scp cert.pem key.pem to /etc/nginx/ssl/alieninc.pem /etc/nginx/ssl/alieninc.key

limit_req_zone $binary_remote_addr zone=alieninc:10m rate=30r/m;

server {
    listen 80;
    server_name alieninc.tech www.alieninc.tech *.alieninc.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name .aliendinc.tech;

    # TLS — Cloudflare Origin CA cert
    ssl_certificate     /etc/nginx/ssl/alieninc.pem;
    ssl_certificate_key /etc/nginx/ssl/alieninc.key;

    # TLS 1.2+ only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suites
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # server_tokens off
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Reverse proxy to Python server on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disable autoindex
    autoindex off;

    # Block sensitive paths server-wide
    location ~ /\.git { deny all; return 404; }
    location ~ /\.env { deny all; return 404; }
    location ~ /\.backups { deny all; return 404; }

    # Rate limiting
    limit_req zone=alieninc burst=10 nodelay;

    # Limit request body size
    client_max_body_size 1m;

    # Logging
    access_log /var/log/nginx/alieninc_access.log combined;
    error_log  /var/log/nginx/alieninc_error.log warn;
}

# ── Deploy instructions ──────────────────────────────────────
# 1. Install NGINX:  sudo apt install nginx -y
# 2. Create SSL dir:  sudo mkdir -p /etc/nginx/ssl
# 3. Place Cloudflare Origin CA cert + key in /etc/nginx/ssl/
# 4. Deploy conf:     sudo cp nginx/alieninc.conf /etc/nginx/sites-available/alieninc
#                     sudo ln -sf /etc/nginx/sites-available/alieninc /etc/nginx/sites-enabled/alieninc
# 5. Test:            sudo nginx -t
# 6. Start:           sudo systemctl enable --now nginx
