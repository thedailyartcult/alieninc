[workspace]
resolver = "2"

[package]
name = "alphazero-mcp-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "alphazero_mcp_client"
path = "src/lib.rs"

[[bin]]
name = "alphazero-mcp-client"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.0"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
