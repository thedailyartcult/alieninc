<!-- Platform: terranean | Page: terranean-purpose | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-terranean-purpose'. -->
<div class="page" id="page-terranean-purpose">
                    <div class="card" style="margin-bottom:16px">
                        <div class="card-header">
                            <span class="card-title">Teleology — Purpose & Trajectory Modeling</span>
                            <button class="btn btn-sm" onclick="inferPurposes()">Infer Purposes</button>
                        </div>
                        <div id="purposeInferResults"><div class="empty-state">Click Infer Purposes to analyze actor behavior patterns and surface goal structures</div></div>
                    </div>
                    <div class="grid grid-2">
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title">Trajectory Projection</span>
                            </div>
                            <div style="margin-bottom:12px">
                                <input type="number" id="trajectoryHorizon" placeholder="Horizon steps (default 10)" value="10" style="width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px">
                                <button class="btn btn-primary btn-sm" onclick="projectTrajectory()">Project Trajectories</button>
                            </div>
                            <div id="trajectoryResults"><div class="empty-state">Infer purposes first, then project forward trajectories</div></div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <span class="card-title">Leverage Points</span>
                            </div>
                            <div style="margin-bottom:12px">
                                <input type="text" id="leverageObjective" placeholder="Objective (e.g., disrupt_failure_chain)" style="width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px">
                                <button class="btn btn-primary btn-sm" onclick="findLeveragePoints()">Find Leverage Points</button>
                            </div>
                            <div id="leverageResults"><div class="empty-state">Define an objective to identify high-impact intervention points</div></div>
                        </div>
                    </div>
                </div>
