<!-- Platform: crackerbox | Page: crackerbox-dashboard | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-crackerbox-dashboard'. -->
<div class="page" id="page-crackerbox-dashboard">
                    <div class="card" style="margin-bottom:16px">
                        <div class="card-header">
                            <span class="card-title">OSINT Intelligence Toolkit</span>
                            <button class="btn btn-sm" onclick="document.getElementById('osintQuery').focus()">New Lookup</button>
                        </div>
                        <div style="display:flex;gap:12px;margin-bottom:16px">
                            <input type="text" id="osintQuery" placeholder="Enter IP address, domain, or entity name for sanctions screening..." style="flex:1;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none">
                            <button class="btn btn-primary" onclick="performOSINTLookup()">Analyze</button>
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">
                            Accepts: IPv4 addresses (8.8.8.8), domains (example.com), or entity names for OFAC sanctions screening
                        </div>
                        <div id="osintResults"></div>
                    </div>
                    <div class="grid grid-3">
                        <div class="card">
                            <div class="card-title">Sanctions Database</div>
                            <div class="card-value" id="sanctionsCount">--</div>
                            <div class="card-sub">OFAC SDN entries indexed</div>
                        </div>
                        <div class="card">
                            <div class="card-title">Last Updated</div>
                            <div class="card-value" style="font-size:16px" id="sanctionsUpdated">--</div>
                            <div class="card-sub">24-hour cache refresh</div>
                        </div>
                        <div class="card">
                            <div class="card-title">Status</div>
                            <div class="card-value" style="font-size:16px;color:var(--green)" id="sanctionsStatus">--</div>
                            <div class="card-sub">Intelligence services</div>
                        </div>
                    </div>
                </div>
