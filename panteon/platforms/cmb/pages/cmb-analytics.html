                        <div>
                            <h2 class="cmb-section-title cmb-reveal">Analytics</h2>

                        <select id="cmbAnalyticsWs" style="background:var(--bg-input);border:1px solid var(--border-color);color:var(--text);padding:10px 14px;font-size:0.88rem;outline:none"></select>
