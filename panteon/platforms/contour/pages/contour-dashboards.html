<!-- Platform: contour | Page: contour-dashboards | Extracted from admin.html — shell lazy-loads this fragment. Keep wrapper id='page-contour-dashboards'. -->
<div class="page" id="page-contour-dashboards">
                    <div class="card" style="margin-bottom:16px">
                        <div class="card-header">
                            <span class="card-title">Dashboard Gallery</span>
                            <button class="btn btn-sm" onclick="loadContourDashboards()">Refresh</button>
                        </div>
                        <div id="dashboardGallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"><div class="empty-state">Loading...</div></div>
                    </div>
                    <div class="card" id="dashboardViewer" style="display:none">
                        <div class="card-header">
                            <span class="card-title" id="dashboardViewerTitle">Dashboard</span>
                            <button class="btn btn-sm" onclick="document.getElementById('dashboardViewer').style.display='none'">Close</button>
                        </div>
                        <div id="dashboardCharts" style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px"></div>
                    </div>
                </div>
